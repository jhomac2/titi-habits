}

/* ---- Comparación de respuestas ---- */
const toks=s=>norm(s).replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));
function coverage(user,exp){
  const E=Array.from(new Set(toks(exp)));
  if(!E.length)return{p:norm(user).trim()===norm(exp).trim()?1:0,hit:[],miss:[]};
  const U=toks(user),hit=[],miss=[];
  E.forEach(w=>{const ok=U.some(u=>u===w||(u.length>=5&&w.length>=5&&(u.indexOf(w.slice(0,5))===0||w.indexOf(u.slice(0,5))===0)));(ok?hit:miss).push(w);});
  return{p:hit.length/E.length,hit,miss};
}

/* ---- Lectura de formatos de preguntas y respuestas ---- */
function parseQA(text){
  const t=text.replace(/\r/g,'').trim();let pairs=[];
  const qre='(?:\\d+[.)]\\s*)?(?:P|Pregunta|Q|Question)\\s*[:.)\\-]\\s*',are='(?:R|Respuesta|A|Answer)\\s*[:.)\\-]\\s*';
  const re=new RegExp('(?:^|\\n)\\s*'+qre+'([\\s\\S]*?)\\n\\s*'+are+'([\\s\\S]*?)(?=\\n\\s*'+qre+'|\\s*$)','gi');
  let m;while((m=re.exec(t))){const q=m[1].trim().replace(/\s*\n\s*/g,' '),a=m[2].trim().replace(/\s*\n\s*/g,' ');if(q&&a)pairs.push({q,a});}
  if(pairs.length)return pairs;
  const lines=t.split('\n').map(l=>l.trim()).filter(Boolean);
  const seps=['\t',' | ',' → ',' => ',';'];
  let best=null;
  seps.forEach(sp=>{const c=lines.filter(l=>l.indexOf(sp)>0&&l.indexOf(sp)<l.length-sp.length).length;if(c>=2&&c>=lines.length*.6&&(!best||c>best.c))best={sp,c};});
  if(best){
    lines.forEach(l=>{const i=l.indexOf(best.sp);if(i>0){let q=l.slice(0,i).trim(),a=l.slice(i+best.sp.length).trim();q=q.replace(/^"|"$/g,'');a=a.replace(/^"|"$/g,'');if(q&&a)pairs.push({q,a});}});
    if(pairs.length)return pairs;
  }
  for(let i=0;i<lines.length-1;i++){
    const l=lines[i].replace(/^\d+[.)]\s*/,'');
    if(/\?\s*$/.test(l)&&!/\?\s*$/.test(lines[i+1])){pairs.push({q:l,a:lines[i+1].replace(/^[-•*]\s*/,'')});i++;}
  }
  return pairs.length>=2?pairs:[];
}

/* ---- Generador automático (reglas simples, sin internet) ---- */
function splitSentences(par){
  return par.replace(/([.!?])\s+(?=[A-ZÁÉÍÓÚÑ¿¡0-9"“(])/g,'$1\u0001').split('\u0001').map(s=>s.trim()).filter(Boolean);
}
const lcFirst=s=>/^(El|La|Los|Las|Un|Una|Unos|Unas)\s/.test(s)?s.charAt(0).toLowerCase()+s.slice(1):s;
const wc=s=>s.trim().split(/\s+/).length;
const stripEnd=s=>s.replace(/[.;,\s]+$/,'');
function genCards(text,{max=20,kind='all'}={}){
  const seen=new Set(),defs=[],clz=[];
  const add=(arr,q,a,t)=>{q=q.trim();a=a.trim();if(!q||!a||q.length<8)return;const k=norm(q);if(seen.has(k))return;seen.add(k);arr.push({q,a,t,on:true});};
  const raw=text.replace(/\r/g,'').split('\n').map(l=>l.trim());
  const bul=l=>/^([-•*·▪●]|\d+[.)])\s+/.test(l);
  const unb=l=>l.replace(/^([-•*·▪●]|\d+[.)])\s+/,'');
  // 1) listas con encabezado terminado en ":"
  for(let i=0;i<raw.length;i++){
    const l=raw[i];
    if(/:\s*$/.test(l)&&l.length<90&&bul(raw[i+1]||'')){
      const items=[];let j=i+1;while(j<raw.length&&bul(raw[j])){items.push(stripEnd(unb(raw[j])));j++;}
      if(items.length>=2)add(defs,'Menciona los elementos de: '+stripEnd(l.replace(/:\s*$/,'')),items.join('; '),'list');
      i=j-1;
    }
  }
  // 2) “Término: definición” o “Término – definición”
  raw.forEach(l0=>{
    const l=unb(l0);
    const m=l.match(/^([^:–—]{2,60}?)\s*:\s*(.{12,})$/)||l.match(/^(.{2,60}?)\s+[–—-]\s+(.{12,})$/);
    if(m&&wc(m[1])<=7&&!/^https?/i.test(m[1])&&!/:\s*$/.test(l)&&wc(m[2])>=3)add(defs,'¿Qué es o qué significa «'+stripEnd(m[1])+'»?',stripEnd(m[2]),'def');
  });
  // 3) frases
  const paras=raw.filter(l=>l&&!bul(l)||(bul(l)&&l.length>40)).map(unb);
  const sentences=[];paras.forEach(p=>splitSentences(p).forEach(s=>{if(wc(s)>=6&&wc(s)<=45&&!/^[^:]{2,60}:\s/.test(s))sentences.push(stripEnd(s));}));
  const freq={};toks(text).forEach(w=>freq[w]=(freq[w]||0)+1);
  const defRe=/^(?:(?:El|La|Los|Las|Un|Una)\s)?(.{2,70}?)\s+(es|son|se define como|consiste en|sirve para|permite|se utiliza para|se usa para)\s+(.{10,})$/i;
  sentences.forEach(s=>{
    const m=s.match(defRe);
    if(m&&wc(m[1])<=8&&!/[,;]/.test(m[1])){
      const subj=lcFirst(s.slice(0,s.length-m[2].length-m[3].length-1).trim());const verb=m[2].toLowerCase();
      let q;
      if(verb==='es'||verb==='son')q='¿Qué '+verb+' '+subj+'?';
      else if(verb==='se define como')q='¿Cómo se define '+subj+'?';
      else if(verb==='consiste en')q='¿En qué consiste '+subj+'?';
      else q='¿Para qué sirve '+subj+'?';
      add(defs,q,cap(stripEnd(m[3])),'def');return;
    }
    // números / años -> completar
    const nm=s.match(/\b(1[5-9]\d\d|20\d\d|\d{2,}(?:[.,]\d+)?\s?%?)\b/);
    if(nm){add(clz,s.replace(nm[0],'_____'),nm[0].trim(),'cloze');return;}
    // término clave -> completar
    const words=s.split(/\s+/);let bestW=null,sc=0;
    words.forEach((w,idx)=>{
      const c=w.replace(/^[("“¿¡]+|[)"”,.;:!?]+$/g,'');if(c.length<4)return;const n=norm(c);if(STOP.has(n))return;
      let v=c.length+((idx>0&&/^[A-ZÁÉÍÓÚÑ]/.test(c))?5:0)-(freq[n]||1)*2;
      if(c.length>=8)v+=2;if(v>sc){sc=v;bestW=c;}
    });
    if(bestW&&sc>=5){const re=new RegExp('(^|[^\\p{L}])'+bestW.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}])','u');add(clz,s.replace(re,'$1_____'),bestW,'cloze');}
  });
  let out=[];
  if(kind==='def')out=defs;
  else if(kind==='cloze')out=clz;
  else{
    out=defs.slice(0,max);
    const room=max-out.length;
    if(room>0){const step=clz.length>room?clz.length/room:1;for(let i=0;i<clz.length&&out.length<max;i+=step)out.push(clz[Math.floor(i)]);}
  }
  return out.slice(0,max);
}

}

/* ---- Lectura de archivos (txt, md, csv, html, docx, pptx) ---- */
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  let eocd=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error('zip');
  const count=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);const files=[];
  for(let n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    files.push({name:new TextDecoder().decode(u8.subarray(p+46,p+46+nl)),method,csize,lho});p+=46+nl+el+cl;
  }
  const read=async f=>{
    const nl=dv.getUint16(f.lho+26,true),el=dv.getUint16(f.lho+28,true),st=f.lho+30+nl+el,data=u8.subarray(st,st+f.csize);
    if(f.method===0)return data;
    const ds=new DecompressionStream('deflate-raw');
    return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer());
  };
  return{files,read};
}
const xmlText=x=>x.replace(/<\/(w:p|a:p)>/g,'\n').replace(/<(w:tab|w:br|a:br)\s*\/>/g,' ').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
async function fileToText(file){
  const name=file.name.toLowerCase();
  if(/\.(docx|pptx)$/.test(name)){
    if(typeof DecompressionStream==='undefined')throw new Error('Tu navegador no puede abrir este formato. Copia el texto y pégalo aquí.');
    const z=await unzip(await file.arrayBuffer());const dec=new TextDecoder();
    if(name.endsWith('.docx')){const f=z.files.find(x=>x.name==='word/document.xml');if(!f)throw new Error('No se encontró texto en el documento.');return xmlText(dec.decode(await z.read(f))).replace(/\n{3,}/g,'\n\n').trim();}
    const slides=z.files.filter(x=>/^ppt\/slides\/slide\d+\.xml$/.test(x.name)).sort((a,b)=>parseInt(a.name.match(/(\d+)\.xml/)[1])-parseInt(b.name.match(/(\d+)\.xml/)[1]));
    let out='';for(const f of slides){out+=xmlText(dec.decode(await z.read(f))).trim()+'\n\n';}return out.trim();
  }
  if(/\.pdf$/.test(name))throw new Error('Los PDF no se pueden leer sin internet. Ábrelo, copia el texto y pégalo aquí.');
  let t=await readText(file);
  if(/\.html?$/.test(name)){const d=new DOMParser().parseFromString(t,'text/html');d.querySelectorAll('script,style').forEach(x=>x.remove());t=d.body?d.body.innerText||d.body.textContent:t;}
  return t.trim();
}

/* ---- Sala de estudio (pantalla completa) ---- */
const RM={on:false,mode:'',queue:[],i:0,ok:0,bad:0,shown:false,t0:0,cardT:0,missed:[],answers:[],title:'',endAt:0,again:new Set(),exam:null};
function buildOptions(card,deck,pool){
  if(card.mc){const o=mcOpts(card);if(o)return o;}
  const right=card.a;
  let cand=pool.filter(x=>x.c.id!==card.id&&norm(x.c.a)!==norm(right)&&x.c.a.length<=150);
  cand.sort((a,b)=>((a.d.id===deck.id?0:1)-(b.d.id===deck.id?0:1))||Math.abs(a.c.a.length-right.length)-Math.abs(b.c.a.length-right.length));
  const uniq=[],seen=new Set();
  shuffle(cand.slice(0,12)).forEach(x=>{const k=norm(x.c.a);if(!seen.has(k)&&uniq.length<3){seen.add(k);uniq.push(x.c.a);}});
  if(uniq.length<3||right.length>150)return null;
  return shuffle(uniq.concat([right]));
}
function openRoom({mode,deckIds,limit=20,title}){
  let items;
  if(mode==='review'){
    items=shuffle(dueCards(deckIds)).concat(shuffle(newCards(deckIds)).slice(0,newAllowed()));
    items=items.slice(0,limit);
  }else{
    items=shuffle(S.study.decks.filter(d=>!deckIds||deckIds.includes(d.id)).flatMap(d=>d.cards.map(c=>({d,c})))).slice(0,limit);
  }
  if(!items.length){toast('No hay tarjetas para estudiar todavía');return;}
  const pool=S.study.decks.flatMap(d=>d.cards.map(c=>({d,c})));
  let queue=items.map(x=>({d:x.d,c:x.c,opts:(mode==='review'&&!x.c.mc)?null:buildOptions(x.c,x.d,pool)}));
  if(mode!=='review'){
    queue=queue.filter(q=>q.opts);
    if(queue.length<3){toast('Para el test necesitas al menos 5 tarjetas con respuestas cortas.');return;}
  }
  Object.assign(RM,{on:true,mode,queue,i:0,ok:0,bad:0,shown:false,pick:null,lastAns:'',t0:Date.now(),cardT:Date.now(),missed:[],answers:[],title:title||'Estudiar',again:new Set(),exam:null,done:false});
  items=queue;
  if(mode==='exam'){RM.endAt=Date.now()+Math.max(60,Math.ceil(items.length*45))*1000;}
  document.body.classList.add('noscroll');
  drawRoom();
  if(mode==='exam')RM.timer=setInterval(roomTick,500);
}
function closeRoom(){
  clearInterval(RM.timer);RM.on=false;$('#room').innerHTML='';
  if(!modalStack.length)document.body.classList.remove('noscroll');
  render();
}
function roomTick(){
  if(!RM.on||RM.mode!=='exam'||RM.done)return;
  const left=Math.ceil((RM.endAt-Date.now())/1000);const el=$('#rm-clock');
  if(el)el.textContent=fmtClock(left);
  if(left<=0)finishRoom();
}
function drawRoom(){
  const box=$('#room');
  if(RM.done){return drawRoomEnd(box);}
  const cur=RM.queue[RM.i];if(!cur){return finishRoom();}
  const{c,opts}=cur;const n=RM.queue.length;
  const useMC=!!opts;
  let body='';
  const qHtml=`<div class="rcard"><div class="rq">${esc(c.q)}</div></div>`;
  if(!useMC){
    if(!RM.shown){
      body=`${qHtml}<label class="small bold" for="rm-ans">Escribe tu respuesta <span class="faint">(responder de memoria es lo que más ayuda a recordar)</span></label><textarea id="rm-ans" class="in" rows="3" placeholder="Con tus palabras…"></textarea><button class="btn primary lg block" data-a="rm-show">Mostrar respuesta <kbd>Ctrl+Enter</kbd></button>`;
    }else{
      const ans=($('#rm-ans')||{}).value||RM.lastAns||'';RM.lastAns=ans;
      const cv=ans.trim()?coverage(ans,c.a):null;
      const sug=cv?(cv.p>=.8?3:cv.p>=.5?2:cv.p>=.25?1:0):null;
      const gb=[[0,'Otra vez','bad'],[1,'Difícil','warn'],[2,'Bien','ok'],[3,'Fácil','ok']];
      body=`${qHtml}${ans.trim()?`<div class="rans you"><div class="tiny faint">Tu respuesta</div>${esc(ans)}</div>`:''}
        <div class="rans"><div class="tiny faint">Respuesta correcta</div>${esc(c.a)}</div>
        ${cv?`<p class="small">Coincidencia con lo esperado: <b>${Math.round(cv.p*100)}%</b>${cv.miss.length?` · Te faltó mencionar: ${cv.miss.slice(0,6).map(w=>`<span class="chip warn">${esc(w)}</span>`).join(' ')}`:' · ¡Cubriste todo lo importante!'}</p>`:'<p class="small muted">Compara con tu memoria y califica con honestidad.</p>'}
        <div class="grades">${gb.map(g=>`<button class="gbtn ${g[2]}${sug===g[0]?' sug':''}" data-a="rm-grade" data-g="${g[0]}"><b>${g[1]}</b><small>${intText(schedule(c,g[0]).int)}</small><kbd>${g[0]+1}</kbd></button>`).join('')}</div>`;
    }
  }else{
    const shown=RM.shown;const pick=RM.pick;
    body=`${qHtml}<div class="opts">${opts.map((o,k)=>{let cls='';if(shown){if(o===c.a)cls=' right';else if(o===pick)cls=' wrong';}else if(RM.mode==='exam'&&o===pick)cls=' sel';return `<button class="opt${cls}" data-a="rm-pick" data-k="${k}" ${shown&&RM.mode!=='exam'?'disabled':''}><kbd>${c.mc&&c.mc.fixed?MC_LET[k]:k+1}</kbd><span>${esc(o)}</span></button>`;}).join('')}</div>
      ${shown&&RM.mode!=='exam'?`<div class="rans ${pick===c.a?'okb':'badb'}"><b>${pick===c.a?'¡Correcto!':'Respuesta correcta:'}</b> ${pick===c.a?'':esc(c.a)}</div>${c.mc&&c.mc.why?`<div class="rans"><div class="tiny faint">Justificación</div>${esc(c.mc.why)}</div>`:''}<button class="btn primary lg block" data-a="rm-next">Siguiente <kbd>Enter</kbd></button>`:''}
      ${RM.mode==='exam'?`<button class="btn primary lg block" data-a="rm-next" ${pick==null?'disabled':''}>${RM.i===n-1?'Terminar examen':'Siguiente'}</button>`:''}`;
  }
  box.innerHTML=`<div class="room" role="dialog" aria-modal="true" aria-label="${esc(RM.title)}"><header class="rh"><button class="ibtn" data-a="rm-close" aria-label="Salir">${IC.x}</button><div class="grow"><div class="row between small"><b>${esc(RM.title)}</b>${RM.mode==='exam'?`<b class="num" id="rm-clock">${fmtClock((RM.endAt-Date.now())/1000)}</b>`:''}<span class="muted">${Math.min(RM.i+1,n)} / ${n}</span></div>${bar(RM.i/n,'var(--c-study)','thin')}</div></header><div class="rb"><div class="rw">${body}</div></div></div>`;
  const ta=$('#rm-ans');if(ta&&!isTouch)ta.focus();
  RM.cardT=RM.cardT||Date.now();
}
function roomNext(){
  RM.i++;RM.shown=false;RM.pick=null;RM.lastAns='';RM.cardT=Date.now();
  if(RM.i>=RM.queue.length)return finishRoom();
  drawRoom();
}
function gradeRoom(g){
  const cur=RM.queue[RM.i];const secs=(Date.now()-RM.cardT)/1000;
  applyGrade(cur.c,g,secs);
  if(g>=1)RM.ok++;else{RM.bad++;RM.missed.push(cur);}
  if(g===0&&!RM.again.has(cur.c.id)&&RM.mode==='review'){RM.again.add(cur.c.id);RM.queue.splice(Math.min(RM.queue.length,RM.i+4),0,{d:cur.d,c:cur.c,opts:null});}
  roomNext();
}
function finishRoom(){
  if(RM.done)return;
  clearInterval(RM.timer);RM.done=true;
  if(RM.mode==='exam'){
    const total=RM.queue.length;const ok=RM.queue.filter((q,k)=>RM.answers[k]===q.c.a).length;
    RM.ok=ok;RM.bad=total-ok;
    RM.queue.forEach((q,k)=>{applyGrade(q.c,RM.answers[k]===q.c.a?2:0,10);});
    RM.missed=RM.queue.filter((q,k)=>RM.answers[k]!==q.c.a);
    S.study.exams.push({id:uid(),date:today(),title:RM.title,ok,total,secs:Math.round((Date.now()-RM.t0)/1000)});save();
  }
  drawRoom();
}
function drawRoomEnd(box){
  const n=RM.queue.length,p=n?RM.ok/(RM.ok+RM.bad||1):0;
  const tomorrow=sum(S.study.decks,d=>d.cards.filter(c=>c.seen&&c.due<=addDays(today(),1)).length);
  const miss=RM.missed;
  box.innerHTML=`<div class="room"><header class="rh"><button class="ibtn" data-a="rm-close" aria-label="Cerrar">${IC.x}</button><div class="grow"><b>${esc(RM.title)}</b></div></header><div class="rb"><div class="rw center">
    ${ringSvg(p,{size:150,stroke:14,color:p>=.7?'var(--ok)':'var(--warn)',text:Math.round(p*100)+'%',sub:RM.mode==='exam'?'nota':'acierto'})}
    <h2 style="margin-top:12px">${p>=.85?'¡Excelente! 🎉':p>=.6?'¡Buen trabajo! 💪':'Cada repaso te acerca 🌱'}</h2>
    <p class="muted">${RM.ok} bien · ${RM.bad} por reforzar · ${fmtMin((Date.now()-RM.t0)/60000)} de estudio</p>
    ${tomorrow?`<p class="small muted">Para mañana te tocarán unas ${tomorrow} tarjetas.</p>`:''}
    ${RM.mode==='exam'&&miss.length?`<div class="stack" style="text-align:left;margin-top:16px"><h4>Revisa lo que fallaste</h4>${miss.map(m=>`<div class="rans"><div class="bold">${esc(m.c.q)}</div><div class="small ok" style="margin-top:4px">✔ ${esc(m.c.a)}</div>${m.c.mc&&m.c.mc.why?`<div class="small muted" style="margin-top:4px">${esc(m.c.mc.why)}</div>`:''}</div>`).join('')}</div>`:''}
    <div class="row wrap" style="justify-content:center;margin-top:20px">${miss.length&&RM.mode!=='exam'?`<button class="btn" data-a="rm-redo">Repasar las que fallé</button>`:''}<button class="btn primary" data-a="rm-close">Terminar</button></div></div></div></div>`;
}
Object.assign(A,{
  'rm-show':()=>{RM.shown=true;drawRoom();},
  'rm-grade':el=>gradeRoom(Number(el.dataset.g)),
  'rm-pick':el=>{
    const cur=RM.queue[RM.i];const o=cur.opts[Number(el.dataset.k)];
    if(RM.mode==='exam'){RM.pick=o;RM.answers[RM.i]=o;drawRoom();return;}
    if(RM.shown)return;RM.pick=o;RM.shown=true;
    const ok=o===cur.c.a;applyGrade(cur.c,ok?2:0,(Date.now()-RM.cardT)/1000);if(ok)RM.ok++;else{RM.bad++;RM.missed.push(cur);}
    drawRoom();
  },
  'rm-next':()=>{if(RM.mode==='exam'&&RM.pick==null)return;roomNext();},
  'rm-close':async()=>{if(!RM.done&&RM.i>0&&RM.i<RM.queue.length&&RM.mode==='exam'){if(!(await ask('¿Salir del examen?','Perderás el avance del examen.','Salir')))return;}closeRoom();},
  'rm-redo':()=>{const items=RM.missed.map(m=>({d:m.d,c:m.c,opts:m.c.mc?mcOpts(m.c):null}));Object.assign(RM,{queue:items,i:0,ok:0,bad:0,shown:false,missed:[],done:false,t0:Date.now(),again:new Set(),mode:'review',title:'Repaso de errores'});drawRoom();}
});
document.addEventListener('keydown',e=>{
  if(!RM.on||modalStack.length)return;
  const cur=RM.queue[RM.i];
  if(e.key==='Escape'&&!RM.done){e.preventDefault();A['rm-close']();return;}
  if(RM.done||!cur)return;
  const mc=!!cur.opts;
  if(!mc){
    if(!RM.shown&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();RM.shown=true;drawRoom();}
    else if(RM.shown&&/^[1-4]$/.test(e.key)){e.preventDefault();gradeRoom(Number(e.key)-1);}
  }else{
    const kk=/^[1-9]$/.test(e.key)?Number(e.key)-1:(cur.c.mc&&cur.c.mc.fixed&&/^[a-e]$/i.test(e.key)?e.key.toLowerCase().charCodeAt(0)-97:-1);
    if(kk>=0&&cur.opts[kk]!==undefined&&!(RM.shown&&RM.mode!=='exam')){e.preventDefault();A['rm-pick']({dataset:{k:kk}});}
    else if(e.key==='Enter'&&((RM.shown&&RM.mode!=='exam')||(RM.mode==='exam'&&RM.pick!=null))){e.preventDefault();A['rm-next']();}
  }
});

/* ---------- Temporizador Pomodoro ---------- */
function tm(){
  let t=S.study.timer;
  if(!t)t=S.study.timer={mode:'focus',dur:S.settings.focus*60,endsAt:null,left:S.settings.focus*60,running:false,cycle:0,course:'',label:''};
  return t;
}
const tLeft=()=>{const t=tm();return t.running?Math.max(0,Math.round((t.endsAt-Date.now())/1000)):t.left;};
function tStart(){const t=tm();if(t.running)return;t.endsAt=Date.now()+t.left*1000;t.running=true;save();}
function tPause(){const t=tm();if(!t.running)return;t.left=tLeft();t.running=false;t.endsAt=null;save();}
function tSet(mode){const t=tm();t.mode=mode;t.dur=(mode==='focus'?S.settings.focus:mode==='short'?S.settings.short:S.settings.long)*60;t.left=t.dur;t.running=false;t.endsAt=null;save();}
function beep(){
  if(!S.settings.sound)return;
  try{const ac=new(window.AudioContext||window.webkitAudioContext)();[0,.28,.56].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=i===2?880:660;o.connect(g);g.connect(ac.destination);const t0=ac.currentTime+d;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.3,t0+.03);g.gain.exponentialRampToValueAtTime(.0001,t0+.24);o.start(t0);o.stop(t0+.26);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
}
function tComplete(){
  const t=tm();const wasFocus=t.mode==='focus';
  if(wasFocus){S.study.sessions.push({id:uid(),date:today(),min:Math.round(t.dur/60),course:t.course,label:t.label,ts:Date.now()});t.cycle++;}
  beep();
  if(S.settings.notif&&'Notification' in window&&Notification.permission==='granted'){try{new Notification(wasFocus?'¡Sesión de enfoque completada!':'Se acabó el descanso',{body:wasFocus?'Tómate un respiro. Lo hiciste muy bien.':'Es hora de volver a enfocarte.'});}catch(e){}}
  toast(wasFocus?'🍅 ¡Sesión completada! Descansa un momento.':'⏰ Descanso terminado. ¡A enfocarse!');
  const next=wasFocus?(t.cycle%(S.settings.every||4)===0?'long':'short'):'focus';
  tSet(next);
  if(S.settings.autoBreak&&wasFocus)tStart();
  save();render();
}
function timerTick(){
  const t=S.study.timer;if(!t||!t.running)return;
  const left=tLeft();
  if(left<=0){tComplete();return;}
  updateTimerUI(left);
}
function updateTimerUI(left){
  const t=tm();if(left==null)left=tLeft();
  const el=$('#pm-time');if(el)el.textContent=fmtClock(left);
  const rg=$('#pm-ring');if(rg)rg.innerHTML=ringSvg(1-left/Math.max(1,t.dur),{size:260,stroke:14,color:t.mode==='focus'?'var(--c-study)':'var(--ok)'});
  renderMini(left);
  document.title=t.running?`${fmtClock(left)} · ${t.mode==='focus'?'Enfoque':'Descanso'} · Titi`:(TITLES[route]?TITLES[route]+' · ':'')+'Titi';
}
function renderMini(left){
  const box=$('#mini');if(!box)return;const t=S.study.timer;
  if(!t||!t.running||(route==='study'&&ui('study',{}).tab==='pomodoro')){box.innerHTML='';return;}
  if(left==null)left=tLeft();
  box.innerHTML=`<button class="mini" data-a="mini-go" aria-label="Ir al temporizador">🍅 <b>${fmtClock(left)}</b><span class="small">${t.mode==='focus'?'Enfoque':'Descanso'}</span></button>`;
}
setInterval(timerTick,500);
Object.assign(A,{
  'mini-go':()=>{ui('study',{}).tab='pomodoro';go('study');},
  'pm-toggle':()=>{const t=tm();t.running?tPause():tStart();render();},
  'pm-reset':()=>{tSet(tm().mode);render();},
  'pm-skip':()=>{const t=tm();tSet(t.mode==='focus'?'short':'focus');render();},
  'pm-mode':el=>{tSet(el.dataset.v);render();},
  'pm-save':()=>{const t=tm();const el=Math.round((t.dur-tLeft())/60);if(t.mode==='focus'&&el>=1){S.study.sessions.push({id:uid(),date:today(),min:el,course:t.course,label:t.label,ts:Date.now()});toast('Guardaste '+el+' min de estudio');}tSet('focus');render();},
  'pm-cfg':()=>formModal({title:'Ajustar el temporizador',submit:'Guardar',
    values:{focus:S.settings.focus,short:S.settings.short,long:S.settings.long,every:S.settings.every,studyGoal:S.settings.studyGoal,autoBreak:S.settings.autoBreak,sound:S.settings.sound,notif:S.settings.notif},

    onSubmit:v=>{
      Object.assign(S.settings,{focus:v.focus||25,short:v.short||5,long:v.long||15,every:v.every||4,studyGoal:v.studyGoal===''?60:v.studyGoal,autoBreak:v.autoBreak,sound:v.sound,notif:v.notif});

    fields:[{name:'min',label:'Minutos estudiados',type:'number',required:true,min:1,max:600,auto:true},{name:'course',label:'Materia',type:'select',opt:true,options:[['','— Ninguna —']].concat(S.courses.map(c=>[c.id,c.name]))},{name:'label',label:'¿Qué estudiaste?',opt:true}],
    onSubmit:v=>{S.study.sessions.push({id:uid(),date:today(),min:Math.round(v.min),course:v.course,label:v.label,ts:Date.now()});save();render();toast('Estudio registrado: '+v.min+' min');}})
});

/* ---------- Modo de estudio ---------- */
function modeModal(deckIds,title){

/* ---------- Plan de examen ---------- */
function buildPlan(date,deckIds){
  const T=today(),L=diffDays(date,T);if(L<0)return null;
  const cards=S.study.decks.filter(d=>deckIds.includes(d.id)).flatMap(d=>d.cards);
  const total=cards.length,unseen=cards.filter(isNewCard).length;
  const learnDays=Math.max(1,L-2);const per=unseen?Math.ceil(unseen/learnDays):0;
  const days=[];
  for(let i=0;i<=L;i++){
    const d=addDays(T,i);let txt,kind='learn';
    if(i===L){txt='Día del examen: repasa 10–15 minutos lo más difícil, desayuna bien y confía.';kind='exam';}
    else if(i===L-1&&L>=2){txt='Repaso final: tarjetas difíciles y un examen simulado corto. Duerme 7–8 horas.';kind='final';}
    else if(i===L-2&&L>=4){txt='Examen simulado completo y corrige tus errores.';kind='sim';}
    else{const est=Math.min(90,Math.max(15,Math.ceil((per+Math.min(total,per*i))*.6)));txt=per?`Aprende ${per} tarjetas nuevas y repasa las que te toquen (≈ ${est} min).`:`Repasa tus tarjetas pendientes (≈ ${Math.min(60,Math.max(15,Math.ceil(total*.4)))} min).`;}
    days.push({date:d,txt,kind});
  }
  return{L,total,unseen,per,days};
}

/* ---------- Lectura de archivos ---------- */
const colIdx=ref=>{const m=String(ref).match(/^([A-Z]+)/i);if(!m)return 0;let n=0;for(const ch of m[1].toUpperCase())n=n*26+ch.charCodeAt(0)-64;return n-1;};
async function xlsxSheets(file){
  if(typeof DecompressionStream==='undefined')throw new Error('Tu navegador no puede abrir archivos de Excel. Guárdalo como CSV o copia las celdas y pégalas.');
  let z;try{z=await unzip(await file.arrayBuffer());}catch(e){throw new Error('Ese archivo no parece un Excel (.xlsx).');}
  const dec=new TextDecoder();
  const get=async n=>{const f=z.files.find(x=>x.name===n);return f?dec.decode(await z.read(f)):null;};
  const xml=s=>new DOMParser().parseFromString(s,'application/xml');
  const wb=await get('xl/workbook.xml');if(!wb)throw new Error('Ese archivo no parece un Excel (.xlsx).');
  const rels=await get('xl/_rels/workbook.xml.rels');const relMap={};
  if(rels)xml(rels).querySelectorAll('Relationship').forEach(r=>{relMap[r.getAttribute('Id')]=r.getAttribute('Target');});
  const shared=[];const ss=await get('xl/sharedStrings.xml');
  if(ss)xml(ss).querySelectorAll('si').forEach(si=>{let t='';si.querySelectorAll('t').forEach(x=>{if(!x.closest('rPh'))t+=x.textContent;});shared.push(t);});
  const out=[];
  for(const sh of Array.from(xml(wb).querySelectorAll('sheet'))){
    const rid=sh.getAttribute('r:id');let tg=relMap[rid];if(!tg)continue;
    tg=tg.startsWith('/')?tg.slice(1):'xl/'+tg.replace(/^\.\//,'');
    const sx=await get(tg);if(!sx)continue;
    const rows=[];
    xml(sx).querySelectorAll('row').forEach(r=>{
      const ri=(parseInt(r.getAttribute('r'),10)||rows.length+1)-1;const arr=[];
      r.querySelectorAll('c').forEach(c=>{
        const t=c.getAttribute('t'),v=c.querySelector('v');let val='';
        if(t==='s')val=v?(shared[parseInt(v.textContent,10)]||''):'';
        else if(t==='inlineStr'){c.querySelectorAll('t').forEach(x=>{val+=x.textContent;});}
        else if(t==='e')val='';
        else if(t==='b')val=v&&v.textContent==='1'?'VERDADERO':'FALSO';
        else val=v?v.textContent:'';
        arr[colIdx(c.getAttribute('r'))]=val;
      });
      rows[ri]=arr;
    });
    out.push({name:sh.getAttribute('name')||'Hoja',rows:Array.from(rows,r=>r||[])});
  }
  return out;
}
function csvRows(text){
  text=String(text).replace(/^﻿/,'');
  const first=text.split(/\r?\n/).slice(0,5).join('\n');
  const delim=(first.match(/\t/g)||[]).length>=(first.match(/;/g)||[]).length&&/\t/.test(first)?'\t':((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"'&&cur==='')q=true;
    else if(ch===delim){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}

    let m;
    if(/^(pregunta|enunciado|planteamiento|question)/.test(c)&&col.q==null){col.q=i;hits++;}
    else if(/^(tema|unidad|categoria|seccion|capitulo|topic)$/.test(c)){col.topic=i;}
    else if(/^(justificacion|explicacion|retroalimentacion|fundamento|razon)/.test(c)){col.why=i;}
    else if(/^respuesta correcta|^respuesta$/.test(c)){col.ans=i;}
    else if(/^(clave|key|letra( correcta)?|correcta|rpta|solucion)$/.test(c)){col.key=i;hits++;}
    else if((m=c.match(OPT_RE))){col.opts[m[1].toUpperCase()]=i;hits++;}
  });
  const letters=Object.keys(col.opts);
  return(col.q!=null&&letters.length>=3&&(col.key!=null||col.ans!=null))?col:null;
}
function mcFromRows(rows){
  let h=-1,col=null;
  for(let i=0;i<Math.min(rows.length,25);i++){const m=mcHeaderMap(rows[i]||[]);if(m){h=i;col=m;break;}}
  if(!col)return null;
  const cards=[];let skipped=0;const get=(r,i)=>i==null?'':String(r[i]==null?'':r[i]).trim();
  const letters=MC_LET.split('').filter(l=>col.opts[l]!=null);
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[];const q=get(r,col.q);if(!q)continue;
    const opts=[],lets=[];
    letters.forEach(l=>{const t=get(r,col.opts[l]);if(t){opts.push(t);lets.push(l);}});
    let key=-1;const k=get(r,col.key!=null?col.key:col.ans);
    const km=k.match(/^([a-e])\s*[\).:]?$/i);
    if(km)key=lets.indexOf(km[1].toUpperCase());
    if(key<0){const a=norm(get(r,col.ans));if(a)key=opts.findIndex(o=>norm(o)===a);}
    if(opts.length<2||key<0){skipped++;continue;}
    cards.push(newMcCard(q,opts,key,get(r,col.why),get(r,col.topic)));
  }
  return{cards,skipped};
}
async function mcTablesFromFile(file){
  const name=file.name.toLowerCase();const tables=[];const notes=[];
  if(/\.xlsx$/.test(name)||/\.xlsm$/.test(name)){
    const sheets=await xlsxSheets(file);
    sheets.forEach(s=>{const r=mcFromRows(s.rows);if(r&&r.cards.length)tables.push({sheet:s.name,...r});else notes.push('Hoja “'+s.name+'” omitida: no tiene columnas de pregunta, A–E y clave.');});
  }else if(/\.xls$/.test(name)){throw new Error('Los .xls antiguos no se pueden abrir. Guárdalo como .xlsx o CSV.');}
  else{const r=mcFromRows(csvRows(await readText(file)));if(r&&r.cards.length)tables.push({sheet:'',...r});}
  return{tables,notes};
}

function moneyResumen(){
  const u=ui('money',{});const p=period(),T=today();
  const list=txIn(p.from,p.to);
  const spent=tsum(list,'gasto'),income=tsum(list,'ingreso'),saved=tsum(list,'ahorro');
  const est=p.kind==='mes'?sum(S.money.cats,catM):sum(S.money.cats,catW);

  const bal=balanceNow();
  const by=spentByCat(list);
  const rows=S.money.cats.map(c=>({c,spent:by[c.id]||0,est:p.kind==='mes'?catM(c):catW(c)})).concat(by['']?[{c:{id:'',name:'Sin categoría',emoji:'🏷️',color:'#8A94A8'},spent:by[''],est:0}]:[]).filter(r=>r.spent>0||r.est>0).sort((a,b)=>b.spent-a.spent||b.est-a.est);

    else if(pc>=.8)msg=`Cuidado: llevas el ${Math.round(pc*100)}% del estimado. Te quedan <b>${money(left)}</b>${dleft>0?` (unos ${money(left/dleft)} por día)`:''}.`;
    else msg=`Vas bien: te quedan <b>${money(left)}</b> del estimado${dleft>0?` (unos ${money(left/dleft)} por día)`:''}.`;
    if(p.kind==='mes'&&p.isNow){const day=parseD(T).getDate();if(day>=4&&spent>0){const proj=spent/day*daysIn(p.mk);msg+=` A este ritmo cerrarías el mes en <b>${money(proj)}</b>${proj>est?' (por encima del estimado)':''}.`;}}
  }

  const segs=rows.filter(r=>r.spent>0).map(r=>({v:r.spent,c:r.c.color,l:r.c.name+': '+money(r.spent)}));
  return `${moneyNav()}
    <div class="grid g4"><div class="stat"><div class="l">Saldo actual real</div><div class="v ${bal<0?'bad':''}">${money(bal)}</div><div class="s">Inicial + ingresos − gastos − ahorro</div></div>
      <div class="stat"><div class="l">Ingresos del ${p.kind}</div><div class="v ok">${money(income)}</div>${p.kind==='mes'&&S.money.incomeM>0?`<div class="s">estimado ${money(S.money.incomeM)}</div>`:''}</div>
      <div class="stat"><div class="l">Gastado real</div><div class="v">${money(spent)}</div>${saved?`<div class="s">+ ${money(saved)} ahorrado</div>`:''}</div>
      <div class="stat"><div class="l">${left<0?'Te pasaste por':'Te queda del estimado'}</div><div class="v ${est>0?budClass(pc):''}">${est>0?money(Math.abs(left)):'—'}</div><div class="s">estimado ${money(est)}</div></div></div>
    <div class="card"><div class="row between wrap"><h3>Gastado vs. estimado</h3><b class="num" style="color:${pc==null?'var(--ink-3)':budColor(pc)}">${pc==null?'—':Math.round(pc*100)+'%'}</b></div>
      <div style="margin:10px 0">${bar(pc||0,pc==null?'var(--ink-3)':budColor(pc),'tall')}</div><p class="small muted">${msg}</p></div>

  const a=debtOpen();

}

function debtApplyPay(d,amount,date,asTx){

function cleanHtml(h){
  const doc=new DOMParser().parseFromString('<body>'+(h||'')+'</body>','text/html');
  (function walk(node){
    Array.from(node.childNodes).forEach(ch=>{
      if(ch.nodeType===3)return;
      if(ch.nodeType!==1){ch.remove();return;}
      walk(ch);
      if(OKTAGS.has(ch.tagName)){Array.from(ch.attributes).forEach(a=>ch.removeAttribute(a.name));}
      else{while(ch.firstChild)node.insertBefore(ch.firstChild,ch);ch.remove();}
    });
  })(doc.body);
  return doc.body.innerHTML.replace(/(<br>)+$/,'');
}

function caretInfo(el){
  const sel=getSelection();if(!sel.rangeCount)return null;const r=sel.getRangeAt(0);
  if(!el.contains(r.startContainer))return null;
  const pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);
  const post=document.createRange();post.selectNodeContents(el);post.setStart(r.endContainer,r.endOffset);
  return{collapsed:sel.isCollapsed,atStart:pre.toString().length===0&&pre.cloneContents().querySelector('img,br')==null,atEnd:post.toString().length===0,pre,post};
}
const frag2html=r=>{const d=document.createElement('div');d.appendChild(r.cloneContents());return d.innerHTML;};
function setCaret(el,off){
  el.focus();const sel=getSelection(),r=document.createRange();
  if(off==null||off==='end'){r.selectNodeContents(el);r.collapse(false);}
  else if(off==='start'||off===0){r.selectNodeContents(el);r.collapse(true);}
  else{
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let left=off,node,placed=false;
    while((node=w.nextNode())){if(left<=node.nodeValue.length){r.setStart(node,left);r.collapse(true);placed=true;break;}left-=node.nodeValue.length;}
    if(!placed){r.selectNodeContents(el);r.collapse(false);}
  }
  sel.removeAllRanges();sel.addRange(r);
}

function blocksHtml(n){

    if(b.t==='ol')num++;else num=0;
    const handle=`<button class="bh" type="button" data-a="blk-menu" data-id="${b.id}" draggable="true" aria-label="Opciones del bloque" tabindex="-1">${IC.grip}</button>`;
    if(b.t==='hr')return `<div class="blk" data-id="${b.id}" data-t="hr">${handle}<hr></div>`;
    const pre=b.t==='todo'?`<button class="ck sq${b.c?' on':''}" type="button" data-a="blk-check" data-id="${b.id}" aria-label="Marcar tarea" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>`:b.t==='ul'?'<span class="bp">•</span>':b.t==='ol'?`<span class="bp num">${num}.</span>`:b.t==='callout'?'<span class="bp">💡</span>':'';
    return `<div class="blk${b.t==='todo'&&b.c?' done':''}" data-id="${b.id}" data-t="${b.t}">${handle}${pre}<div class="bc" contenteditable="true" role="textbox" aria-multiline="true" data-ph="${b.t==='p'?'Escribe “/” para ver los comandos':btype(b.t)[1]}" spellcheck="true">${b.h}</div></div>`;

}

const RMEM={lastBc:null};

/* ---- Menú “/” ---- */
const SM={on:false,id:null,idx:0,items:[]};
function slashClose(){SM.on=false;const s=$('#slash');if(s)s.remove();}
function slashUpdate(el,b,txt){
  const m=txt.match(/^\/(\S*)$/);
  if(!m||b.t==='code'){slashClose();return;}
  const q=norm(m[1]);
  SM.items=BTYPES.filter(t=>!q||norm(t[1]+' '+t[3]).includes(q));
  if(!SM.items.length){slashClose();return;}
  if(!SM.on||SM.id!==b.id)SM.idx=0;SM.idx=Math.min(SM.idx,SM.items.length-1);SM.on=true;SM.id=b.id;
  let s=$('#slash');if(!s){s=document.createElement('div');s.id='slash';s.className='menu slash';s.setAttribute('role','listbox');document.body.appendChild(s);}
  s.innerHTML=SM.items.map((t,i)=>`<button type="button" class="${i===SM.idx?'on':''}" data-i="${i}" role="option"><span class="si">${t[2]}</span><span>${t[1]}</span></button>`).join('');
  const r=el.getBoundingClientRect();s.style.left=Math.min(r.left,innerWidth-250)+'px';
  const h=s.offsetHeight;s.style.top=(r.bottom+6+h>innerHeight?Math.max(8,r.top-h-6):r.bottom+6)+'px';
  $$('button',s).forEach(btn=>{btn.onmousedown=e=>{e.preventDefault();slashApply(Number(btn.dataset.i));};});
}
function slashApply(i){
  const n=curNote(),t=SM.items[i];if(!n||!t)return;const b=byId(n.blocks,SM.id);if(!b)return;
  slashClose();b.h='';b.t=t[0];
  if(b.t==='hr'){const nb=newBlock('p');n.blocks.splice(blkIdx(n,b.id)+1,0,nb);touchNote(n);redrawBlocks(nb.id,'start');return;}
  touchNote(n);redrawBlocks(b.id,'start');
}

/* ---- Teclado del editor ---- */
function noteKey(e,n){
  const el=e.target.closest('.bc');if(!el)return;
  const b=n.blocks[blkIdx(n,el.parentNode.dataset.id)];if(!b)return;
  if(SM.on){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();SM.idx=(SM.idx+(e.key==='ArrowDown'?1:-1)+SM.items.length)%SM.items.length;slashUpdate(el,b,el.textContent);return;}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();slashApply(SM.idx);return;}
    if(e.key==='Escape'){e.preventDefault();slashClose();return;}
  }
  if(e.isComposing)return;
  const ci=caretInfo(el);
  if(e.key==='Enter'){
    if(e.shiftKey||b.t==='code'){e.preventDefault();document.execCommand('insertLineBreak');return;}
    e.preventDefault();if(!ci)return;
    const before=frag2html(ci.pre),after=frag2html(ci.post);
    const empty=!htmlText(before).trim()&&!htmlText(after).trim();
    if(empty&&(b.t==='ul'||b.t==='ol'||b.t==='todo'||b.t==='quote'||b.t==='callout')){b.t='p';b.h='';touchNote(n);redrawBlocks(b.id,'start');return;}
    b.h=cleanHtml(before);
    const nt=(b.t==='ul'||b.t==='ol'||b.t==='todo')?b.t:'p';
    const nb=newBlock(nt,cleanHtml(after));n.blocks.splice(blkIdx(n,b.id)+1,0,nb);touchNote(n);
    redrawBlocks(nb.id,'start');return;
  }
  if(e.key==='Backspace'&&ci&&ci.collapsed&&ci.atStart){
    const i=blkIdx(n,b.id);
    if(b.t!=='p'){e.preventDefault();b.t='p';touchNote(n);redrawBlocks(b.id,'start');return;}
    if(i>0){
      e.preventDefault();const prev=n.blocks[i-1];
      if(prev.t==='hr'){n.blocks.splice(i-1,1);touchNote(n);redrawBlocks(b.id,'start');return;}
      const off=htmlText(prev.h).length;prev.h=cleanHtml(prev.h+b.h);n.blocks.splice(i,1);touchNote(n);redrawBlocks(prev.id,off);return;
    }
  }
  if(e.key==='Delete'&&ci&&ci.collapsed&&ci.atEnd){
    const i=blkIdx(n,b.id),nx=n.blocks[i+1];
    if(nx&&nx.t!=='hr'){e.preventDefault();const off=htmlText(b.h).length;b.h=cleanHtml(b.h+nx.h);n.blocks.splice(i+1,1);touchNote(n);redrawBlocks(b.id,off);return;}
  }
  if(e.key==='ArrowUp'&&ci&&ci.collapsed&&ci.atStart&&!e.shiftKey){
    const i=blkIdx(n,b.id);for(let k=i-1;k>=0;k--){if(n.blocks[k].t!=='hr'){e.preventDefault();setCaret(blkEl(n.blocks[k].id),'end');return;}}
  }
  if(e.key==='ArrowDown'&&ci&&ci.collapsed&&ci.atEnd&&!e.shiftKey){
    const i=blkIdx(n,b.id);for(let k=i+1;k<n.blocks.length;k++){if(n.blocks[k].t!=='hr'){e.preventDefault();setCaret(blkEl(n.blocks[k].id),'start');return;}}
  }
}
function lineToBlock(l){
  let m;
  if((m=l.match(/^#{1}\s+(.*)/)))return newBlock('h1',esc(m[1]));
  if((m=l.match(/^#{2}\s+(.*)/)))return newBlock('h2',esc(m[1]));
  if((m=l.match(/^#{3,}\s+(.*)/)))return newBlock('h3',esc(m[1]));
  if((m=l.match(/^[-*]\s+\[( |x|X)\]\s+(.*)/)))return newBlock('todo',esc(m[2]),m[1]!==' ');
  if((m=l.match(/^[-*•]\s+(.*)/)))return newBlock('ul',esc(m[1]));
  if((m=l.match(/^\d+[.)]\s+(.*)/)))return newBlock('ol',esc(m[1]));
  if((m=l.match(/^>\s*(.*)/)))return newBlock('quote',esc(m[1]));
  if(/^(-{3,}|_{3,})$/.test(l))return newBlock('hr','');
  return newBlock('p',esc(l));
}
function notePaste(e,n){
  const el=e.target.closest('.bc');if(!el)return;e.preventDefault();
  const text=(e.clipboardData||window.clipboardData).getData('text/plain').replace(/\r/g,'');
  if(!/\n/.test(text.trim())){document.execCommand('insertText',false,text.replace(/\n/g,' '));return;}
  const b=n.blocks[blkIdx(n,el.parentNode.dataset.id)];if(!b)return;
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const blocks=lines.map(lineToBlock);
  const i=blkIdx(n,b.id);
  if(!htmlText(b.h).trim()&&b.t==='p'){n.blocks.splice(i,1,...blocks);}else n.blocks.splice(i+1,0,...blocks);
  touchNote(n);redrawBlocks(blocks[blocks.length-1].id,'end');
}

/* ---- Acciones ---- */
function blockMenu(el){
  const n=curNote();if(!n)return;const id=el.dataset.id,i=blkIdx(n,id),b=n.blocks[i];if(!b)return;
  const conv=BTYPES.filter(t=>t[0]!==b.t&&t[0]!=='hr').map(t=>({l:'Convertir en: '+t[1],ic:t[2],fn:()=>{b.t=t[0];if(t[0]==='code')b.h=esc(htmlText(b.h));touchNote(n);redrawBlocks(b.id,'end');}}));
  openMenu(el,[...conv.slice(0,6),'hr',
    {l:'Subir',ic:'↑',fn:()=>{if(i>0){[n.blocks[i-1],n.blocks[i]]=[n.blocks[i],n.blocks[i-1]];touchNote(n);redrawBlocks(b.id,'end');}}},
    {l:'Bajar',ic:'↓',fn:()=>{if(i<n.blocks.length-1){[n.blocks[i+1],n.blocks[i]]=[n.blocks[i],n.blocks[i+1]];touchNote(n);redrawBlocks(b.id,'end');}}},
    {l:'Duplicar',ic:'⧉',fn:()=>{const c=newBlock(b.t,b.h,b.c);n.blocks.splice(i+1,0,c);touchNote(n);redrawBlocks(c.id,'end');}},
    {l:'Eliminar bloque',ic:'🗑️',cls:'dng',fn:()=>{n.blocks.splice(i,1);if(!n.blocks.length)n.blocks.push(newBlock('p'));touchNote(n);redrawBlocks(n.blocks[Math.max(0,i-1)].id,'end');}}],{left:true});
}

  },
  'blk-add-end':()=>{const n=curNote();const last=n.blocks[n.blocks.length-1];if(last&&last.t==='p'&&!htmlText(last.h).trim()){setCaret(blkEl(last.id),'end');return;}const nb=newBlock('p');n.blocks.push(nb);touchNote(n);redrawBlocks(nb.id,'start');},
  fmt:el=>{
    const c=el.dataset.c;const sel=getSelection();
    const bc=RMEM.lastBc&&document.contains(RMEM.lastBc)?RMEM.lastBc:null;if(!bc){toast('Haz clic en el texto y selecciona lo que quieres formatear');return;}
    if(!bc.contains(sel.anchorNode)){bc.focus();}

function goalP(g){
  if(g.done)return 1;
  if(g.ms&&g.ms.length)return g.ms.filter(m=>m.d).length/g.ms.length;
  return clamp(num(g.pct)/100,0,1);
}
const goalsActive=()=>S.goals.filter(g=>!g.done);
const goalsDone=()=>S.goals.filter(g=>g.done).length;
function goalsProgress(){
  const act=goalsActive();

  const avg=act.length?sum(act,goalP)/act.length:1;
  return{total:S.goals.length,done:goalsDone(),active:act.length,p:S.goals.length?goalsDone()/S.goals.length:null,avg};
}
function goalDone(g,on){

function goalSync(g){

function searchAll(q){
  q=norm(q.trim());if(!q)return[];
  const out=[];const has=s=>norm(s).includes(q);
  Object.keys(TITLES).forEach(k=>{if(has(TITLES[k]))out.push({g:'Ir a',ic:'➡️',t:TITLES[k],k:'nav',id:k});});
  S.tasks.forEach(t=>{if(has(t.title+' '+(t.notes||'')))out.push({g:'Tareas',ic:t.status==='done'?'☑️':'⬜',t:t.title,s:t.due?relDay(t.due):'',k:'task',id:t.id});});
  S.assignments.forEach(a=>{if(has(a.title+' '+(a.notes||'')))out.push({g:'Entregas y exámenes',ic:atype(a.type)[1],t:a.title,s:a.due?relDay(a.due):'',k:'asg',id:a.id});});
  S.courses.forEach(c=>{if(has(c.name+' '+(c.teacher||'')))out.push({g:'Materias',ic:'🎓',t:c.name,s:c.teacher||'',k:'course',id:c.id});});
  S.habits.forEach(h=>{if(has(h.name))out.push({g:'Hábitos',ic:h.icon,t:h.name,k:'habit',id:h.id});});
  S.notes.forEach(n=>{const body=n.blocks.map(b=>htmlText(b.h)).join(' ');if(has(n.title+' '+body+' '+(n.tags||[]).join(' ')))out.push({g:'Notas',ic:n.icon||'📄',t:n.title||'Sin título',s:noteSnippet(n).slice(0,60),k:'note',id:n.id});});
  S.goals.forEach(g=>{if(has(g.title))out.push({g:'Metas',ic:g.emoji,t:g.title,k:'goal',id:g.id});});
  S.study.decks.forEach(d=>d.cards.forEach(c=>{if(out.filter(x=>x.k==='card').length<8&&has(c.q+' '+c.a))out.push({g:'Tarjetas de estudio',ic:'🃏',t:c.q.slice(0,80),s:d.name,k:'card',id:d.id});}));
  S.money.tx.slice().sort((a,b)=>b.date<a.date?-1:1).forEach(t=>{if(out.filter(x=>x.k==='tx').length<6&&has((t.note||'')+' '+(txcat(t)?txcat(t).name:'')))out.push({g:'Movimientos',ic:t.type==='gasto'?'💸':t.type==='ingreso'?'💵':'🐷',t:(t.note||(txcat(t)?txcat(t).name:'Movimiento'))+' · '+money(t.amount),s:fmtShort(t.date),k:'tx',id:t.id});});
  return out.slice(0,40);
}
function searchHtml(q){
  const r=searchAll(q);
  if(!q.trim())return`<p class="muted small center" style="padding:20px 8px">Escribe para buscar en tus tareas, notas, materias, hábitos, tarjetas y movimientos.</p>`;
  if(!r.length)return`<p class="muted small center" style="padding:20px 8px">Nada coincide con “${esc(q)}”.</p>`;
  let g='',h='';
  r.forEach(x=>{if(x.g!==g){g=x.g;h+=`<div class="group-h">${esc(g)}</div>`;}h+=`<button class="item click" data-a="s-go" data-k="${x.k}" data-id="${x.id}"><span class="si">${x.ic}</span><span class="grow"><span class="t trunc" style="display:block">${esc(x.t)}</span>${x.s?`<span class="small muted trunc" style="display:block">${esc(x.s)}</span>`:''}</span></button>`;});
  return h;
}

function photoFromFile(f,cb){
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',.85));};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('No se pudo leer esa imagen');};
  img.src=url;
}

function importData(text){
  if(text.length>25e6){toast('El archivo es demasiado grande para ser un respaldo');return;}
  let o;try{o=JSON.parse(text);}catch(e){toast('El archivo no es un respaldo válido');return;}
  const d=o&&typeof o==='object'&&(o.app==='impulso'||o.app==='titi')&&o.data&&typeof o.data==='object'?o.data:(o&&o.tasks&&o.settings?o:null);
  if(!d||Array.isArray(d)){toast('Ese archivo no parece un respaldo de '+APP.name);return;}
  const nuevo=Number(d.v)>SCHEMA?' Ojo: viene de una versión más nueva de la app; algunas cosas podrían no verse.':'';
  ask('¿Restaurar este respaldo?','Reemplazará todo lo que hay ahora en este dispositivo'+(o.exported?' con la copia del '+fmtShort(String(o.exported).slice(0,10)):'')+'. Podrás deshacerlo.'+nuevo,'Restaurar',false).then(ok=>{
    if(!ok)return;
    const prev=JSON.stringify(S);
    try{localStorage.setItem(KEY+'.prev',prev);}catch(e){}
    S=normalizeState(d);S.settings.onboarded=true;save(true);applyTheme();BADGES_QUIET=true;checkBadges();BADGES_QUIET=false;render(true);
    toast('Respaldo restaurado ✔',{undo:()=>restorePrev(prev)});
  });
}

VIEWS.settings={render:settingsHtml};
CH.set=el=>{
  const p=el.dataset.p,t=el.dataset.t;let v=el.value;
  if(t==='n'){v=num(v);}else if(t==='n0'){v=el.value===''?'':Math.round(num(v));}else v=v.trim();
  setPath(p,v);
  if(p==='settings.studyGoal'&&v==='')S.settings.studyGoal=0;
  if(/^settings\.(focus|short|long)$/.test(p)){const tt=S.study.timer;if(tt&&!tt.running){tt.dur=S.settings[tt.mode==='focus'?'focus':tt.mode==='short'?'short':'long']*60;tt.left=tt.dur;}}
  save();applyTheme();render();
};
CH['set-chk']=el=>{setPath(el.dataset.p,el.checked);save();};
CH['simple-toggle']=el=>{S.settings.simple=el.checked;save();render();};
CH.accent=el=>{S.settings.accent=el.value;save();applyTheme();render();};
Object.assign(A,{
  'set-seg':el=>{setPath(el.dataset.p,el.dataset.v);save();applyTheme();render();},
  'photo-pick':()=>pickFile('image/*',f=>photoFromFile(f,d=>{S.profile.photo=d;save();render();toast('Foto actualizada');})),
  'photo-del':()=>{S.profile.photo='';save();render();},
  backup:()=>{doBackup();toast('Respaldo descargado. Guárdalo en un lugar seguro.');if(route==='home'||route==='settings')render();},
  'restore-prev':()=>ask('¿Volver a lo anterior?','Se reemplazará lo que tienes ahora por la copia que se guardó justo antes de restaurar o borrar.','Volver',false).then(ok=>{if(ok)restorePrev();}),
  'dl-corrupt':()=>downloadCorrupt(),
  restore:()=>pickFile('.json,application/json',async f=>importData(await readText(f))),
  'csv-export':()=>exportCsv(),
  demo:async()=>{if(!hasAnyData()||await ask('¿Cargar datos de ejemplo?','Reemplazarán lo que tienes ahora. Te recomendamos descargar un respaldo antes.','Cargar ejemplo',false)){loadDemo();}},
  'reset-all':async()=>{
    if(!await ask('¿Borrar todos tus datos?','Se eliminarán tareas, hábitos, notas, gastos y todo lo demás de este dispositivo. No se puede deshacer.','Sí, borrar todo'))return;
    if(!await ask('Última confirmación','Descarga un respaldo antes si no estás seguro. ¿Borrar definitivamente?','Borrar definitivamente'))return;
    const keep={theme:S.settings.theme,accent:S.settings.accent};resetAll();S.settings.theme=keep.theme;S.settings.accent=keep.accent;S.settings.onboarded=false;save(true);applyTheme();BADGES_QUIET=true;render(true);openWizard();
  },
  install:async()=>{if(!DEFER_INSTALL)return;DEFER_INSTALL.prompt();try{await DEFER_INSTALL.userChoice;}catch(e){}DEFER_INSTALL=null;render();},
  notif:async()=>{
    if(!('Notification' in window))return;
    if(Notification.permission==='granted'){S.settings.notif=!S.settings.notif;}
    else{const r=await Notification.requestPermission();S.settings.notif=r==='granted';if(r!=='granted')toast('El navegador no dio permiso para avisos');}
    save();render();
  },
  wizard:()=>openWizard()
});

const WZ={step:0,m:null};
const WSTEPS=4;
function wizBody(){
  const p=S.profile,s=S.settings,st=WZ.step;
  let h='';
  if(st===0){
    h=`<div class="wiz-c"><div class="wiz-logo">${BOLT}</div><h2>Bienvenido a Titi</h2><p class="lead">Tu vida de estudiante en un solo lugar: tareas, hábitos, universidad, estudio, dinero, notas y metas. Sin internet, sin cuentas y sin complicaciones.</p>
      <ul class="wiz-feat"><li><span>✅</span>Organiza lo pendiente como en Notion</li><li><span>🔥</span>Crea hábitos una vez y te aparecen cada día</li><li><span>🧠</span>Estudia con preguntas y repaso inteligente</li><li><span>💰</span>Controla lo que gastas frente a lo que planeaste</li><li><span>🎙️</span>Háblale a Titi: «agrega una tarea…»</li></ul>
      <p class="faint small">Son 3 pasos rápidos. Todo se puede cambiar después en Ajustes.</p></div>`;
  }else if(st===1){
    h=`<div class="wiz-c"><h2>Cuéntanos de ti</h2><p class="muted">Solo el nombre es útil; lo demás es opcional.</p>
      <div class="form"><div class="fld"><label for="w-name">¿Cómo te llamas?</label><input id="w-name" class="in" data-in="prof" data-f="name" value="${esc(p.name)}" placeholder="Tu nombre" autocomplete="given-name" maxlength="40"></div>
      <div class="fld half"><label for="w-age">Edad <em>opcional</em></label><input id="w-age" class="in" type="number" min="10" max="99" data-in="prof" data-f="age" value="${esc(p.age)}"></div>
      <div class="fld half"><label>Foto <em>opcional</em></label><button type="button" class="btn" data-a="wiz-photo">${p.photo?'Cambiar foto ✔':'Subir foto'}</button></div>
      <div class="fld"><label for="w-uni">Universidad <em>opcional</em></label><input id="w-uni" class="in" data-in="prof" data-f="uni" value="${esc(p.uni)}" placeholder="Nombre de tu universidad"></div>
      <div class="fld"><label for="w-car">Carrera <em>opcional</em></label><input id="w-car" class="in" data-in="prof" data-f="career" value="${esc(p.career)}" placeholder="Ej.: Ingeniería en Software"></div></div></div>`;
  }else if(st===2){
    h=`<div class="wiz-c"><h2>Hazlo a tu medida</h2>
      <div class="form"><div class="fld"><label>Tema</label>${segHtml('wiz-set',[['auto','Automático'],['light','Claro'],['dark','Oscuro']],s.theme,'data-k="theme"')}</div>
      <div class="fld"><label>Color principal</label><div class="sw acc-sw">${Object.keys(ACCENTS).map(k=>`<label title="${ACCENTS[k][2]}"><input type="radio" name="w-accent" value="${k}" data-ch="wiz-accent"${s.accent===k?' checked':''}><i style="background:${ACCENTS[k][0]}"></i></label>`).join('')}</div></div>
      <div class="fld"><label>La semana empieza el</label>${segHtml('wiz-set',[['1','Lunes'],['0','Domingo'],['6','Sábado']],String(s.weekStart),'data-k="weekStart"')}</div>
      <div class="fld"><label for="w-cur">Moneda</label><select id="w-cur" class="in" data-ch="wiz-cur">${CURRENCIES.map(c=>`<option value="${c[0]}"${s.currency===c[0]?' selected':''}>${c[1]}</option>`).join('')}</select></div></div></div>`;
  }else{
    h=`<div class="wiz-c"><h2>Así se usa Titi</h2>
      <ol class="wiz-how"><li><b>Inicio</b> te muestra el progreso de todo y lo que toca hoy.</li><li>El botón <b>＋ Añadir</b> (o la tecla <kbd>N</kbd>) crea tareas, gastos, notas y más en segundos.</li><li>En <b>Universidad</b> agrega tus materias, horario y entregas. En <b>Estudio</b> pega tus apuntes y Titi crea preguntas para practicar.</li><li>En <b>Contabilidad</b> crea <i>tus propias categorías</i> de gasto y compara lo estimado con lo real.</li><li>En <b>Hábitos</b> créalos una vez: te aparecen cada día y cuentan tu racha.</li><li><b>Respaldo:</b> tus datos viven en este dispositivo. Descarga una copia desde Ajustes de vez en cuando.</li></ol>
      <p class="small" style="margin:8px 0">🎙️ <b>Nuevo:</b> toca el botón del micrófono y dile a Titi lo que quieres. Por ejemplo: «gasté 5 dólares en almuerzo».</p>
      <p class="faint small">¿Dudas? Toca <b>Ayuda</b> en el menú cuando quieras.</p>
      <div class="row wrap" style="gap:8px;margin-top:6px"><button class="btn" data-a="wiz-demo">Probar con datos de ejemplo</button></div></div>`;
  }
  const dots=Array.from({length:WSTEPS},(_,i)=>`<i class="${i===st?'on':i<st?'past':''}"></i>`).join('');
  return `${h}<div class="wiz-f"><div class="wiz-dots" aria-hidden="true">${dots}</div><div class="row-s">${st>0?'<button class="btn" data-a="wiz-back">Atrás</button>':'<button class="btn ghost" data-a="wiz-skip">Omitir</button>'}<button class="btn primary" data-a="${st===WSTEPS-1?'wiz-done':'wiz-next'}">${st===0?'Empezar':st===WSTEPS-1?'¡Listo, a darle!':'Siguiente'}</button></div></div>
    <p class="wiz-credit">${designedBy()}</p>`;
}
function wizDraw(){const b=$('.wiz-b');if(b){b.innerHTML=wizBody();const f=b.querySelector('input.in');if(f&&!isTouch&&WZ.step===1)f.focus();}}
function openWizard(){
  if(WZ.m)return;
  WZ.step=0;
  WZ.m=openModal({title:'Bienvenida',cls:'wiz',focus:false,html:'<div class="wiz-b"></div>',onClose:()=>{WZ.m=null;S.settings.onboarded=true;BADGES_QUIET=false;save();render();}});
  wizDraw();
}
Object.assign(A,{
  'wiz-next':()=>{WZ.step=Math.min(WSTEPS-1,WZ.step+1);wizDraw();},
  'wiz-back':()=>{WZ.step=Math.max(0,WZ.step-1);wizDraw();},
  'wiz-skip':()=>closeModal(WZ.m),
  'wiz-done':()=>{closeModal(WZ.m);go('home');},
  'wiz-photo':()=>pickFile('image/*',f=>photoFromFile(f,d=>{S.profile.photo=d;save();wizDraw();})),
  'wiz-set':el=>{const k=el.dataset.k;S.settings[k]=k==='weekStart'?Number(el.dataset.v):el.dataset.v;save();applyTheme();wizDraw();},
  'wiz-demo':async()=>{closeModal(WZ.m);loadDemo(true);}
});
CH['wiz-accent']=el=>{S.settings.accent=el.value;save();applyTheme();};
CH['wiz-cur']=el=>{S.settings.currency=el.value;save();};
IN.prof=el=>{const f=el.dataset.f;S.profile[f]=f==='age'?(el.value===''?'':Math.round(num(el.value))):el.value;save();};

   ${sec('🎙️','Titi, tu asistente de voz',`<p>Toca el botón flotante 🎙️ (abajo a la derecha) y habla, o escribe en su panel. Para que te escuche como Alexa, activa <b>Escuchar «Titi» siempre</b> en el panel o en Ajustes y di <b>«Titi, …»</b>.</p><ul><li><b>Tareas:</b> «Titi, agrega una tarea llamar a mamá mañana a las 5», «recuérdame sacar la basura todos los días a las 9 de la noche».</li><li><b>Dinero:</b> «gasté 5 dólares en almuerzo», «me pagaron 30 dólares», «Juan me debe 20 dólares», «le debo 10 a María», «¿cuánto he gastado este mes?».</li><li><b>Universidad:</b> «agrega un examen de redes el viernes a las 10», «tengo un deber de cálculo para mañana».</li><li><b>Notas y hábitos:</b> «agrega una nota: ideas para el proyecto», «marca el hábito tomar agua», «completa la tarea pagar el internet».</li><li><b>Consultas:</b> «¿qué tengo hoy?», «¿qué hábitos me faltan?», «¿cuál es mi saldo?».</li><li><b>Moverte:</b> «ve a contabilidad», «abre el calendario», «inicia un pomodoro de 25 minutos».</li><li><b>Equivocaciones:</b> di «deshacer lo último». Si no entiende, te ofrece guardarlo como tarea.</li></ul><p class="small muted"><b>Límites:</b> solo escucha con Titi abierta y la pantalla encendida; necesita permiso del micrófono y, en la mayoría de navegadores, internet (la voz la reconoce el navegador, no Titi). Funciona mejor en Chrome o Edge; en iPhone y Firefox puede fallar: escríbele en su panel. Si cambias la palabra «Titi» en Ajustes, también cambia la de llamarlo.</p>`)}
   ${sec('➕','Añadir cosas rápido',`<p>El botón <b>＋ Añadir</b> (arriba en PC, flotante en el celular) abre un menú para crear una tarea, hábito, gasto, ingreso, entrega, nota o meta. En PC, pulsa <kbd>N</kbd>.</p><p>En <b>Tareas</b> puedes escribir en lenguaje natural: <i>“Entregar informe mañana 15:00 !alta”</i> y Titi entiende la fecha, la hora y la prioridad.</p>`)}
   ${sec('✅','Tareas',`<ul><li>Dos vistas: <b>lista</b> (agrupada por fecha) y <b>tablero</b> (Por hacer / En progreso / Hecha).</li><li>Prioridad, categoría, fecha, hora, subtareas y repetición (diaria, semanal, mensual).</li><li>Crea tus propias categorías con color e ícono.</li></ul>`)}
   ${sec('🔥','Hábitos',`<ul><li>Créalos <b>una sola vez</b> y elige qué días te tocan; aparecerán cada día automáticamente.</li><li>Marca el círculo cuando lo cumplas. La racha 🔥 cuenta días seguidos.</li><li>Puedes corregir días pasados desde la tira semanal. Toca un hábito para ver su mapa de calor.</li><li><b>Contadores y minutos:</b> al crear un hábito elige «Contar» (vasos de agua, guineos…) o «Minutos al día» (inglés, estudio, ejercicio). Tocas <b>+</b> y la barra avanza; al llegar a la meta el hábito queda hecho y suma a tu racha.</li></ul>`)}

/* =====================================================================
   Recordatorios y calendario (.ics)
   - .ics: lo abre Google Calendar / Apple Calendario / Outlook y allí SÍ
     te avisan aunque la app esté cerrada.
   - Avisos internos: funcionan mientras Titi está abierta (pestaña o app).
   ===================================================================== */
const icsEsc=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(line){
  const enc=new TextEncoder(),dec=new TextDecoder();const bytes=enc.encode(line);
  if(bytes.length<=75)return line;
  const out=[];let i=0,first=true;
  while(i<bytes.length){
    let n=first?75:74;let end=Math.min(i+n,bytes.length);
    while(end<bytes.length&&(bytes[end]&0xC0)===0x80)end--;   // no partir caracteres UTF-8
    out.push((first?'':' ')+dec.decode(bytes.slice(i,end)));i=end;first=false;
  }
  return out.join('\r\n');
}
const icsD=s=>s.replace(/-/g,'');
const icsT=(d,t)=>icsD(d)+'T'+String(t||'00:00').replace(':','').padStart(4,'0')+'00';
const icsAddMin=(d,t,m)=>{const tot=hm2min(t)+m;const dd=addDays(d,Math.floor(tot/1440));const mm=((tot%1440)+1440)%1440;return icsT(dd,pad(Math.floor(mm/60))+':'+pad(mm%60));};
function buildIcs(){
  const T=today(),lead=S.settings.remLead||15;const L=[];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const ev=(uid,summary,desc,start,end,alarm,rrule)=>{
    L.push('BEGIN:VEVENT','UID:'+uid+'@titi.local','DTSTAMP:'+stamp,...start,...(end||[]));
    if(rrule)L.push('RRULE:'+rrule);
    L.push('SUMMARY:'+icsEsc(summary));if(desc)L.push('DESCRIPTION:'+icsEsc(desc));
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(summary),'TRIGGER:'+alarm,'END:VALARM','END:VEVENT');
  };
  L.push('BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Titi//Titi//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Titi','X-WR-TIMEZONE:'+(Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'));
  let n=0;
  const dated=(uid,summary,desc,d,t,dur)=>{
    if(t)ev(uid,summary,desc,['DTSTART:'+icsT(d,t)],['DTEND:'+icsAddMin(d,t,dur)],'-PT'+lead+'M');
    else ev(uid,summary,desc,['DTSTART;VALUE=DATE:'+icsD(d)],['DTEND;VALUE=DATE:'+icsD(addDays(d,1))],'PT8H');
    n++;
  };
  S.tasks.filter(t=>t.status!=='done'&&t.due&&t.due>=T).forEach(t=>dated('tarea-'+t.id,'☑ '+t.title,t.notes||'',t.due,t.time||'',30));
  S.assignments.filter(a=>a.status!=='done'&&a.due&&a.due>=T).forEach(a=>{const c=ccourse(a.course);dated('entrega-'+a.id,atype(a.type)[1]+' '+atype(a.type)[2]+': '+a.title+(c?' ('+c.name+')':''),a.notes||'',a.due,a.time||'',60);});
  const until=icsT(addDays(T,140),'23:59');const BY=['SU','MO','TU','WE','TH','FR','SA'];
  S.courses.forEach(c=>(c.sched||[]).forEach((b,i)=>{
    if(typeof b.day!=='number'||!b.start||!b.end)return;
    let d=T;for(let k=0;k<7&&dow(d)!==b.day;k++)d=addDays(d,1);
    ev('clase-'+c.id+'-'+i,'🏫 '+c.name+(b.room||c.room?' · '+(b.room||c.room):''),(c.teacher?'Docente: '+c.teacher:''),['DTSTART:'+icsT(d,b.start)],['DTEND:'+icsT(d,b.end)],'-PT'+lead+'M','FREQ=WEEKLY;BYDAY='+BY[b.day]+';UNTIL='+until);n++;
  }));
  L.push('END:VCALENDAR');
  return{text:L.map(icsFold).join('\r\n')+'\r\n',count:n};
}
function exportIcs(){
  const r=buildIcs();
  if(!r.count){toast('No hay tareas, entregas ni clases con fecha para exportar');return;}
  download('titi-calendario-'+today()+'.ics',r.text,'text/calendar');
  toast('Listo: abre el archivo .ics y se agrega a tu calendario ('+r.count+' eventos)',{ms:5000});
}

async function ensureNotif(){
  if(!('Notification' in window))return false;
  if(Notification.permission==='granted')return true;
  if(Notification.permission==='denied')return false;
  try{return (await Notification.requestPermission())==='granted';}catch(e){return false;}
}
function notify(title,body,tag){
  if(typeof LOCKED!=='undefined'&&LOCKED){title='Titi';body='Tienes un recordatorio (desbloquea para verlo)';}
  const sys='Notification' in window&&Notification.permission==='granted'&&S.settings.notif;
  let shown=false;
  if(sys){
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,tag,icon:'icons/icon-192.png'})).catch(()=>{try{new Notification(title,{body,tag});}catch(e){}});shown=true;}
      else{new Notification(title,{body,tag});shown=true;}
    }catch(e){}
  }
  if(!shown||document.visibilityState==='visible')toast('🔔 '+title+(body?' · '+body:''),{ms:7000});
  try{if(typeof titiSay==='function'&&S.settings.titi&&S.settings.titiVoice&&document.visibilityState==='visible'&&!(typeof LOCKED!=='undefined'&&LOCKED))titiSay(title+(body?'. '+body:''));}catch(e){}
}
function remEvents(d){
  const out=[];
  classesOn(d).forEach(b=>out.push({key:'c|'+b.course.id+'|'+d+'|'+b.start,time:b.start,title:'Clase de '+b.course.name,body:b.start+'–'+b.end+((b.room||b.course.room)?' · '+(b.room||b.course.room):'')}));
  S.tasks.filter(t=>t.status!=='done'&&t.due===d&&t.time).forEach(t=>out.push({key:'t|'+t.id+'|'+d,time:t.time,title:'Tarea: '+t.title,body:'A las '+t.time}));
  S.assignments.filter(a=>a.status!=='done'&&a.due===d&&a.time).forEach(a=>out.push({key:'a|'+a.id+'|'+d,time:a.time,title:atype(a.type)[2]+': '+a.title,body:'A las '+a.time}));
  return out;
}
function reminderTick(){
  if(!S.settings.rem)return;
  const T=today(),nm=nowMin(),lead=S.settings.remLead||15;
  const sent=S.meta.notified=S.meta.notified||{};let changed=false;
  remEvents(T).forEach(e=>{
    const at=hm2min(e.time);
    if(nm>=at-lead&&nm<=at&&!sent[e.key]){sent[e.key]=T;changed=true;const mins=at-nm;notify(e.title,(mins>0?'En '+mins+' min · ':'Ahora · ')+e.body,e.key);}

function tTaskFrom(P,{pre=''}={}){
  const w=tWhen(P);

  let m=P.cut(/\b(?:prioridad\s+)?(alta|urgente|media|baja)\b(?:\s+prioridad)?/);if(m){prio={alta:3,urgente:3,media:2,baja:1}[m[1]];}

  else if(P.cut(/\b(cada\s+semana|todas\s+las\s+semanas|semanalmente)\b/))repeat='weekly';
  else if(P.cut(/\b(cada\s+mes|todos\s+los\s+meses|mensualmente)\b/))repeat='monthly';

  let course='';
  const cs=S.courses.find(c=>P.n.includes(norm(c.name)));if(cs)course=cs.id;
  let title=P.title();
  if(cs&&norm(title)===norm(cs.name))title='Tarea de '+cs.name;
  return{title,due:w.due,time:w.time,prio,repeat,cat,course};
}

    const wantHabit=/\bhabito\b/.test(n),wantTask=/\btarea\b|\bpendiente\b/.test(n);
    const T=today();
    const tasks=wantHabit?[]:tMatch(S.tasks.filter(t=>t.status!=='done'),P,t=>t.title);
    const habits=wantTask?[]:tMatch(activeHabits().filter(h=>!h.log[T]),P,h=>h.name);
    const all=[...tasks.map(x=>({k:'t',x})),...habits.map(x=>({k:'h',x}))];
    if(all.length===1){
      const it=all[0];
      if(it.k==='t'){setTaskDone(it.x,true);save();render();return tOk('¡Tarea «'+it.x.title+'» completada! 💪',()=>{setTaskDone(it.x,false);});}
      setHabitDay(it.x,T,true);save();render();return tOk('Hábito «'+it.x.name+'» marcado hoy. 🔥 Racha: '+habitStreak(it.x)+'.',()=>{setHabitDay(it.x,T,false);});
    }
    if(!all.length&&!wantTask){const hd=tMatch(activeHabits().filter(h=>h.log[T]),P,h=>h.name);if(hd.length===1)return tOk('«'+hd[0].name+'» ya estaba marcado hoy. ✔️');}
    if(all.length>1)return tNo('¿Cuál? Encontré: '+tJoin(all.slice(0,4).map(i=>'«'+(i.k==='t'?i.x.title:i.x.name)+'»'))+'.');
    if(m)return tNo('No encontré una tarea ni un hábito pendiente parecido a «'+P.o+'».');
  }
  /* --- agregar tarea --- */
  let tm1=/^(?:(?:por\s+favor|titi)\s+)?(?:agrega|agregar|anade|añade|crea|crear|pon|poner|apunta|apuntar|anota|anotar|programa|registra|guarda|nueva|nuevo|haz)\s+(?:me\s+)?(?:una\s+|la\s+|mi\s+|otra\s+)?(?:nueva\s+)?(?:tarea|pendiente|recordatorio)\b\s*(.*)$/.exec(n);
  let rest=null;
  if(tm1){const P=TP(raw);P.cut(/^.*?\b(?:tarea|pendiente|recordatorio)\b\s*/);rest=P;}
  else if((tm1=/^(?:recuerdame|recordarme|recuérdame)\s+(?:que\s+)?(.+)$/.exec(n))){const P=TP(raw);P.cut(/^\S+\s+(?:que\s+)?/);rest=P;}
  else if((tm1=/^(?:tengo\s+que|debo|necesito|hay\s+que)\s+(.+)$/.exec(n))&&!/\bdebo\s+\d/.test(n)){const P=TP(raw);P.cut(/^(?:tengo\s+que|debo|necesito|hay\s+que)\s+/);rest=P;}
  else if((tm1=/^(?:agrega|anade|pon|apunta|anota)\s+(.+?)\s+(?:a|en)\s+(?:mis\s+tareas|mi\s+lista|la\s+lista|mis\s+pendientes)$/.exec(n))){const P=TP(raw);P.cut(/^\S+\s+/);P.cut(/\s+(?:a|en)\s+(?:mis\s+tareas|mi\s+lista|la\s+lista|mis\s+pendientes)$/);rest=P;}
  if(rest){
    rest.cut(/^(?:de|para|que|llamada|:)\s+/);
    const d=tTaskFrom(rest);
    if(!d.title)return tNo('¿Cuál es la tarea? Di, por ejemplo: «agrega una tarea comprar pan mañana a las 5».');
    const t=tPushTask(d);save();render();
    return tOk('Tarea «'+t.title+'» agregada'+(t.due?' para '+tDayWord(t.due)+(t.time?' a las '+t.time:''):'')+(t.prio===3?' con prioridad alta':'')+'.',()=>{S.tasks=S.tasks.filter(x=>x.id!==t.id);});
  }
  /* --- otros --- */
  if(/\b(bloquea|bloquear)\b.*\b(app|aplicacion|titi|pantalla)?\b/.test(n)&&/^(bloquea|bloquear)/.test(n)){if(!pinSet())return tNo('Aún no tienes PIN. Créalo en Ajustes → Privacidad.');lockNow();return tOk('Bloqueada.');}
  if(/\b(descarga|exporta|baja)\b.*\brespaldo\b/.test(n)){doBackup();return tOk('Respaldo descargado.');}
  if(/\b(exporta|descarga|baja|manda)\b.*\bcalendario\b/.test(n)){exportIcs();return tOk('Calendario exportado.');}
  if(/^(que\s+hora\s+es|dime\s+la\s+hora)/.test(n)){const d=new Date();return tOk('Son las '+d.getHours()+':'+pad(d.getMinutes())+'.');}
  if(/^(que\s+dia\s+es|que\s+fecha\s+es|fecha\s+de\s+hoy)/.test(n))return tOk('Hoy es '+fmtLong(today())+'.');
  /* --- no entendí: ofrecer guardarlo como tarea --- */
  const words=n.split(' ').length;
  if(words>=2&&words<=14&&!/^(que|como|cuando|donde|quien|por\s+que)\b/.test(n)){
    const P=TP(raw);const d=tTaskFrom(P);
    if(d.title){
      TITI.pending={fn:()=>{const t=tPushTask(d);save();render();return tOk('Listo, guardé la tarea «'+t.title+'».',()=>{S.tasks=S.tasks.filter(x=>x.id!==t.id);});}};
      return{ok:false,reply:'No entendí esa orden. ¿Quieres que la guarde como tarea: «'+d.title+'»'+(d.due?' para '+tDayWord(d.due)+(d.time?' a las '+d.time:''):'')+'? Di sí o no.',ask:true};
    }
  }
  return tNo('No entendí. Prueba con: «agrega una tarea comprar pan mañana», «gasté 5 en almuerzo» o «qué tengo hoy».');
}

/* =====================================================================
   Titi · voz (Web Speech API), botón flotante y panel de conversación
   Límites reales: solo escucha con la app abierta y la pantalla encendida;
   el reconocimiento lo hace el navegador (Chrome/Edge, normalmente con internet).
   ===================================================================== */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const TITI={said:'',saidUntil:0,sup:!!SRC,rec:null,mode:'',want:false,awaiting:0,mute:0,speaking:false,fails:0,startedAt:0,gotResult:false,log:[],undo:null,pending:null,open:false,state:'off',msg:'',ac:null};
const T_LANGS=[['es-EC','Español (Ecuador)'],['es-CO','Español (Colombia)'],['es-PE','Español (Perú)'],['es-MX','Español (México)'],['es-AR','Español (Argentina)'],['es-ES','Español (España)'],['es-US','Español (EE. UU.)']];
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function titiWakeList(){const w=norm(S.settings.titiWake||'titi').trim()||'titi';const l=[w];if(w==='titi')l.push('tity','tiki','tiqui','titti','ti ti','tite');return l;}
function findWake(text){
  const n=norm(text);const src=n.length===text.length?text:n;
  for(const v of titiWakeList()){
    const m=new RegExp('(^|[^a-z0-9])'+escRe(v)+'(?![a-z0-9])').exec(n);
    if(m){const end=m.index+m[0].length;return{rest:src.slice(end).replace(/^[\s,.:;!?¡¿\-]+/,'').trim()};}
  }
  return null;
}
function stripWake(text){
  const n=norm(text);if(n.length!==text.length)return text;
  for(const v of titiWakeList()){const m=new RegExp('^(?:(?:oye|hey|ok|okay|hola)\\s+)?'+escRe(v)+'(?![a-z0-9])[\\s,.:;!?¡¿\\-]*').exec(n);if(m)return text.slice(m[0].length).trim()||text;}
  return text;
}
function titiEcho(text){
  /* ¿lo que oí es lo que Titi acaba de decir? (evita que se escuche a sí misma) */
  if(!TITI.said||Date.now()>TITI.saidUntil)return false;
  const w=norm(text).split(' ').filter(Boolean);if(w.length<2)return norm(text)===TITI.said;
  const set=new Set(TITI.said.split(' '));return w.filter(x=>set.has(x)).length/w.length>=.7;
}
function titiBeep(f=880){
  if(!S.settings.sound)return;
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=TITI.ac||(TITI.ac=new C());const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12);}catch(e){}
}
function titiSay(text){
  if(!('speechSynthesis' in window)||!text)return;
  try{
    speechSynthesis.cancel();
    const clean=String(text).replace(/[«»]/g,'').replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,'').replace(/\s+/g,' ').trim();if(!clean)return;
    const u=new SpeechSynthesisUtterance(clean);u.lang=S.settings.titiLang||'es-EC';
    const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang.replace('_','-')===u.lang)||vs.find(x=>x.lang.toLowerCase().startsWith('es'));if(v)u.voice=v;
    u.rate=1.03;TITI.speaking=true;TITI.mute=Date.now()+60000;TITI.said=norm(clean);TITI.saidUntil=Date.now()+60000;
    let fin=false;const done=()=>{if(fin)return;fin=true;TITI.speaking=false;TITI.mute=Date.now()+600;TITI.saidUntil=Date.now()+5000;};
    u.onend=done;u.onerror=done;setTimeout(done,2500+clean.length*95);
    speechSynthesis.speak(u);
  }catch(e){TITI.speaking=false;TITI.mute=0;}
}
/* ---------- estado visible ---------- */
const T_STATE={off:'En reposo',wake:'Escuchando… di «'+'Titi'+'»',await:'Te escucho…',once:'Te escucho, habla ahora…'};
function titiSetState(st,msg){
  TITI.state=st;if(msg!==undefined)TITI.msg=msg;
  const fab=$('#titi-fab');if(fab){fab.className='tfab '+st;fab.setAttribute('aria-label',st==='off'?'Hablar con Titi':'Titi: '+titiStatusText());}
  const s=$('#tp-st');if(s)s.textContent=titiStatusText();
  const mic=$('#tp-mic');if(mic)mic.classList.toggle('on',st==='once'||st==='await');
}
function titiStatusText(){
  if(TITI.msg)return TITI.msg;
  const w=(S.settings.titiWake||'titi');
  return TITI.state==='wake'?'Escuchando… di «'+w.charAt(0).toUpperCase()+w.slice(1)+'»':T_STATE[TITI.state]||'';
}
function titiLive(t){const e=$('#tp-live');if(e)e.textContent=t?'🎙️ '+t:'';}
function titiLog(who,text,extra={}){
  TITI.log.push({who,text,...extra});if(TITI.log.length>14)TITI.log.shift();titiDrawLog();
}
function titiDrawLog(){
  const box=$('#tp-log');if(!box)return;
  const items=TITI.log.length?TITI.log:[{who:'titi',text:'Hola, soy Titi 👋 Escríbeme una orden o toca el micrófono. Por ejemplo: «'+T_EXAMPLES[0]+'».'}];
  box.innerHTML=items.map(m=>`<div class="tm ${m.who}${m.ok===false?' no':''}">${esc(m.text)}</div>`).join('');
  box.scrollTop=box.scrollHeight;
}
/* ---------- ejecutar una orden ---------- */
function titiHandle(text,{voice=false}={}){
  if(LOCKED)return;
  text=stripWake(text);
  titiLog('me',text);
  let r;
  try{r=titiExec(text);}catch(err){console.error(err);r={ok:false,reply:'Uy, algo falló al hacer eso.'};}
  if(r.undo)TITI.undo=r.undo;
  titiLog('titi',r.reply,{ok:r.ok});
  titiLive('');
  if(voice&&S.settings.titiVoice)titiSay(r.reply);
  if(!TITI.open){
    if(r.ok&&r.undo)toast('🎙️ '+r.reply,{undo:()=>{r.undo();TITI.undo=null;save();render();},ms:6000});
    else toast('🎙️ '+r.reply,{ms:6000});
  }
  if(r.help)titiOpenPanel();
  if(r.ask){
    if(TITI.mode==='wake'&&TITI.want)TITI.awaiting=Date.now()+12000;
    else if(voice&&TITI.sup)setTimeout(()=>titiStartRec('once'),TITI.speaking||S.settings.titiVoice?2200:600);
  }
  return r;
}
function titiHeard(text){
  if(LOCKED||titiEcho(text))return;
  if(TITI.mode==='once'){titiStopRec(true);titiSetState(TITI.want?'wake':'off');titiHandle(text,{voice:true});if(TITI.want)setTimeout(()=>titiResume(),400);return;}
  const hit=findWake(text);
  if(hit){
    if(hit.rest.length>=2){TITI.awaiting=0;titiHandle(hit.rest,{voice:true});}
    else{TITI.awaiting=Date.now()+9000;titiSetState('await');titiBeep();titiLog('titi','Dime…');if(S.settings.titiVoice)titiSay('Dime');else titiOpenPanel();}
  }else if(TITI.awaiting&&Date.now()<TITI.awaiting){TITI.awaiting=0;titiSetState('wake');titiHandle(text,{voice:true});}
  else titiLive('');
}
/* ---------- reconocimiento ---------- */
function titiStopRec(silent){
  const r=TITI.rec;TITI.rec=null;
  if(r){try{r.onend=null;r.onerror=null;r.onresult=null;r.onstart=null;r.abort();}catch(e){}}
  if(!silent)titiSetState('off');
}
function titiStartRec(mode){
  if(!SRC||LOCKED)return false;
  titiStopRec(true);
  let rec;try{rec=new SRC();}catch(e){return false;}
  rec.lang=S.settings.titiLang||'es-EC';rec.interimResults=true;rec.continuous=mode==='wake';rec.maxAlternatives=1;
  TITI.rec=rec;TITI.mode=mode;TITI.startedAt=Date.now();TITI.gotResult=false;
  rec.onstart=()=>{TITI.msg='';titiSetState(mode==='wake'?(TITI.awaiting>Date.now()?'await':'wake'):'once');};
  rec.onresult=e=>{
    if(Date.now()<TITI.mute)return;
    let fin='',interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript+' ';else interim+=r[0].transcript;}
    TITI.gotResult=true;
    titiLive((fin||interim).trim());
    if(fin.trim())titiHeard(fin.trim());
  };
  rec.onerror=e=>{
    const err=e&&e.error;
    if(err==='not-allowed'||err==='service-not-allowed'){titiFail('Permite el micrófono en el navegador para que Titi te escuche.');}
    else if(err==='audio-capture'){titiFail('No encuentro un micrófono.');}
    else if(err==='network'){TITI.fails+=2;titiSetState(TITI.state,'El reconocimiento de voz necesita internet.');if(TITI.fails>=6)titiFail('El reconocimiento de voz necesita internet.');}
    else if(err==='language-not-supported'){S.settings.titiLang='es-ES';save();}
  };
  rec.onend=()=>{
    if(TITI.rec!==rec)return;
    TITI.rec=null;
    if(mode==='wake'&&TITI.want){
      const quick=Date.now()-TITI.startedAt<1500&&!TITI.gotResult;
      TITI.fails=quick?TITI.fails+1:0;
      if(TITI.fails>=6){titiFail('No pude mantener la escucha. Usa el botón del micrófono.');return;}
      setTimeout(()=>{if(TITI.want&&!TITI.rec&&!LOCKED&&document.visibilityState==='visible')titiStartRec('wake');},quick?900:250);
    }else{titiSetState(TITI.want?'wake':'off');if(TITI.want)setTimeout(titiResume,300);}
  };

}
function titiResume(){if(TITI.want&&!TITI.rec&&!LOCKED&&document.visibilityState==='visible')titiStartRec('wake');}
function titiFail(msg){
  TITI.want=false;titiStopRec(true);

  titiSetState('off',msg);toast('🎙️ '+msg,{ms:6000});
  if(route==='settings')render();
}
async function titiEnable(on){
  if(!on){TITI.want=false;titiStopRec();S.settings.titi=false;save();TITI.msg='';titiSetState('off');return;}
  if(!SRC){S.settings.titi=false;save();toast('Este navegador no tiene reconocimiento de voz. Prueba Chrome o Edge; mientras tanto puedes escribirle a Titi.',{ms:6000});render();return;}
  S.settings.titi=true;save();TITI.want=true;TITI.fails=0;TITI.msg='';

function titiMic(){
  if(!SRC){toast('Este navegador no tiene reconocimiento de voz. Prueba Chrome o Edge; mientras tanto puedes escribirle a Titi.',{ms:6000});titiOpenPanel();return;}
  if(TITI.want&&TITI.mode==='wake'&&TITI.rec){TITI.awaiting=Date.now()+9000;titiSetState('await');titiBeep();return;}

/* ---------- panel y botón ---------- */

/* =====================================================================
   Arranque, PWA y mantenimiento
   ===================================================================== */
function setupPWA(){
  try{
    const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
    x.fillStyle='#2F5BEA';
    if(x.roundRect){x.beginPath();x.roundRect(0,0,180,180,44);x.fill();}else x.fillRect(0,0,180,180);
    x.fillStyle='#FFC233';x.beginPath();const k=1.8;[[56,12],[26,56],[47,56],[42,88],[74,42],[53,42]].forEach((p,i)=>i?x.lineTo(p[0]*k,p[1]*k):x.moveTo(p[0]*k,p[1]*k));x.closePath();x.fill();
    const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);
  }catch(e){}
  if(/^https?:$/.test(location.protocol)){
    try{
      fetch('manifest.webmanifest',{method:'HEAD'}).then(r=>{if(r.ok){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);}}).catch(()=>{});
      if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
    }catch(e){}
  }
}
let _errShown=false;
function onFail(){if(_errShown)return;_errShown=true;try{toast('Algo salió mal. Si se repite, descarga un respaldo en Ajustes y recarga la página.');}catch(e){}}
window.addEventListener('error',onFail);
window.addEventListener('unhandledrejection',onFail);

(function boot(){
  load();
  applyTheme();
  setupPWA();
  let lastDay=today();
  const tick=()=>{const t=today();if(t!==lastDay){lastDay=t;render();}};
  setInterval(tick,60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tick();});
  onHash();
  BADGES_QUIET=true;checkBadges();BADGES_QUIET=false;
  if(pinSet())lockNow();
  startReminders();
  titiBoot();
  if(!S.settings.onboarded){
    if(hasAnyData()){S.settings.onboarded=true;save();}else{BADGES_QUIET=true;openWizard();}
  }
  const m=$('#main');if(m)m.removeAttribute('aria-busy');
  if(LOAD_ERR)setTimeout(()=>{ask('No pude leer tus datos guardados','Empezaste con la app en blanco, pero NO borré lo anterior: quedó una copia dentro de este navegador. Descárgala ahora y guárdala; si quieres, se puede recuperar.','Descargar copia',false).then(ok=>{if(ok)downloadCorrupt();});},400);
})();

</script>
