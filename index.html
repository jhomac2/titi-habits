<!doctype html>

<meta name="apple-mobile-web-app-capable" content="yes">

<script>
(function(){try{var s=(JSON.parse(localStorage.getItem('impulso.v1')||'{}').settings)||{};var t=s.theme||'auto';if(t==='auto'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<style>
/* ===== Tokens ===== */
:root{
  color-scheme:light;
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --sunk:#E9EDF4;
  --line:#E1E5EE; --line-2:#CBD3E2;
  --ink:#0E1A2F; --ink-2:#46526A; --ink-3:#5E6A83;
  --accent:#2F5BEA; --on-accent:#fff;
  --sun:#FFC233; --ok:#0B7D52; --warn:#8F5A00; --bad:#C42F36;
  --c-tasks:#2F5BEA; --c-habits:#0FA06A; --c-study:#7C5CFA; --c-money:#E39A0B;
  --c-uni:#0E9AAE; --c-notes:#6C7A99; --c-goals:#E0457B; --c-journal:#F0712A;
  --r1:10px; --r2:14px; --r3:20px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-h:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Nunito",var(--font);
  --pop:0 24px 60px -12px rgba(14,26,47,.30),0 0 0 1px rgba(14,26,47,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme=dark]{
  color-scheme:dark;
  --bg:#0A111F; --surface:#111A2D; --surface-2:#16213A; --sunk:#0C1424;
  --line:#22304D; --line-2:#334563;
  --ink:#E8EEF9; --ink-2:#A3B1CA; --ink-3:#8A9AB8;
  --sun:#FFCB4D; --ok:#34C98B; --warn:#F2B13D; --bad:#FF6B70;
  --c-tasks:#6B93FF; --c-habits:#34D399; --c-study:#A78BFA; --c-money:#F5B83D;
  --c-uni:#2DD4E6; --c-notes:#9AA8C7; --c-goals:#FF7AA8; --c-journal:#FF9A5A;
  --pop:0 24px 60px -10px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07);
}

/* ===== Reset ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:8px;z-index:999}
.skip:focus{left:8px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ===== Type ===== */
h1{font:800 clamp(26px,3.6vw,34px)/1.1 var(--font-h);letter-spacing:-.025em}
h2{font:750 20px/1.25 var(--font-h);letter-spacing:-.015em}
h3{font:700 16px/1.3 var(--font-h);letter-spacing:-.01em}
h4{font:650 14px/1.3 var(--font)}
.h3{font:700 16px/1.3 var(--font-h);letter-spacing:-.01em}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.small{font-size:13px}.tiny{font-size:12px}
.bold{font-weight:700}.center{text-align:center}.right{text-align:right}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:16px 12px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.col-main{min-width:0;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px clamp(16px,3vw,40px);background:color-mix(in srgb,var(--bg) 95%,transparent);-webkit-}
.main{flex:1;padding:8px clamp(16px,3vw,40px) 72px;outline:0}
.page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.foot{padding:18px clamp(16px,3vw,40px) 28px;text-align:center;color:var(--ink-3);font-size:13px}
.foot a{color:var(--ink-2);font-weight:600}
.bnav{display:none}
.fab{display:none}

.stack{display:flex;flex-direction:column;gap:12px}.stack-s{display:flex;flex-direction:column;gap:6px}.stack-l{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:10px}.row-s{display:flex;align-items:center;gap:6px}
.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}.end{margin-left:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gauto-s{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.split-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}

@media(max-width:899px){
  .app{display:block}
  .side{display:none}
  .col-main{min-height:100dvh}
  .topbar{padding:10px 16px}
  .main{padding:4px 16px calc(150px + var(--safe-b))}
  .page{gap:16px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.split-r{grid-template-columns:minmax(0,1fr)}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 98%,transparent);-webkit-border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(76px + var(--safe-b));z-index:41;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);box-shadow:0 10px 26px -6px color-mix(in srgb,var(--accent) 70%,#000),0 0 0 1px rgba(0,0,0,.06)}
  .fab:active{transform:scale(.95)}
  .foot{padding-bottom:calc(110px + var(--safe-b))}
}
@media(max-width:560px){
  .g2{grid-template-columns:minmax(0,1fr)}
  .g3{grid-template-columns:minmax(0,1fr)}
  .gauto{grid-template-columns:minmax(0,1fr)}
}

/* ===== Chrome: sidebar, topbar, bottom nav ===== */
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 10px;font:800 21px/1 var(--font-h);letter-spacing:-.03em;color:var(--ink);text-decoration:none!important}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.me{color:var(--ink);text-decoration:none!important;display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);text-align:left;width:100%}
.me .nm{font-weight:700;line-height:1.2}
.me .lv{font-size:12px;color:var(--ink-2)}
.me .bar{height:5px;margin-top:6px}
.nav-g{padding:14px 10px 4px;font-size:12.5px;font-weight:650;color:var(--ink-3)}
.nav{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:11px;color:var(--ink-2);font-weight:620;text-decoration:none!important;width:100%;text-align:left}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--surface));color:var(--ink)}
.nic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface))}
.nav .pill{margin-left:auto}
.side-sp{flex:1}
.credit{padding:12px 10px 2px;font-size:12.5px;color:var(--ink-3);line-height:1.4}
.credit a{color:var(--ink-2);font-weight:650}

.tb-title{font:750 18px var(--font-h);letter-spacing:-.01em;display:none}
.sbtn{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px 0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);width:min(360px,46vw);text-align:left}
.sbtn:hover{border-color:var(--ink-3)}
.sbtn .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font:600 11.5px var(--font);padding:2px 6px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2)}
.ibtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.ibtn:hover{background:var(--sunk);color:var(--ink)}
.ibtn.sm{width:30px;height:30px;border-radius:8px}
.ibtn svg,.btn svg{flex:none}
.topbar .end{display:flex;gap:6px;align-items:center}
@media(max-width:899px){
  .tb-title{display:block}
  .sbtn{display:none}
  .topbar .btn.add{display:none}
}
.bn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;font-size:11px;font-weight:650;color:var(--ink-3);min-height:50px;justify-content:center}
.bn .ic{font-size:21px;line-height:1.2;filter:grayscale(1);opacity:.65;transition:filter .15s,opacity .15s}
.bn.on{color:var(--ink)}
.bn.on .ic{filter:none;opacity:1}

.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:6px}
.ph .sub{color:var(--ink-2);margin-top:6px;max-width:62ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ===== Surfaces ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.card.flat{background:var(--surface-2);border-color:transparent}
.card.hero{border-radius:var(--r3);padding:22px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h.p{padding:16px 18px 0;margin-bottom:6px}
.card-h .link{font-size:13px;font-weight:650}
.stat{padding:14px 16px;border-radius:var(--r2);background:var(--surface);border:1px solid var(--line);min-width:0}
.stat .l{font-size:13px;color:var(--ink-2)}
.stat .v{font:800 26px/1.15 var(--font-h);letter-spacing:-.02em;margin-top:4px;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.tip{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r2);background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line))}
.tip .t-ic{font-size:22px;line-height:1.3}
.tip h4,.tip .tip-h{margin-bottom:2px;font:650 14px/1.3 var(--font);letter-spacing:0}
.tip p,.tip ol,.tip ul{font-size:14px;color:var(--ink-2)}
.tip ol,.tip ul{padding-left:18px;list-style:revert;margin-top:4px}
.tip .x{margin-left:auto;align-self:flex-start}
.empty{text-align:center;padding:34px 18px;border:1.5px dashed var(--line-2);border-radius:var(--r2);color:var(--ink-2)}
.empty .e-ic{font-size:38px;line-height:1.2;margin-bottom:6px}
.empty h3{color:var(--ink);margin-bottom:4px}
.empty p{max-width:46ch;margin:0 auto 14px}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ===== Buttons & chips ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r1);font-weight:650;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);white-space:nowrap;transition:background .12s,transform .08s,border-color .12s;text-decoration:none!important}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.soft{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);border-color:transparent}
.btn.soft:hover{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
html[data-theme=dark] .btn.danger,html[data-theme=dark] .pill:not(.soft){color:#0A111F}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.lg{min-height:50px;padding:0 22px;font-size:16px;border-radius:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.lnk{color:var(--accent);font-weight:650;padding:0}
.lnk:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:650;line-height:1.55;background:color-mix(in srgb,var(--c,var(--ink-3)) 14%,var(--surface));color:color-mix(in srgb,var(--c,var(--ink-3)) 52%,var(--ink));white-space:nowrap}
.chip.line{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}
.chip.bad{--c:var(--bad)}.chip.ok{--c:var(--ok)}.chip.warn{--c:var(--warn)}
.chipbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13.5px}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.chipbtn.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.pill{display:inline-block;min-width:20px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;text-align:center;line-height:20px}
.pill.soft{background:var(--sunk);color:var(--ink-2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink-3));flex:none;display:inline-block}

/* ===== Tabs & segmented ===== */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;font-weight:650;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-color:var(--accent)}
.seg{display:inline-flex;background:var(--sunk);padding:3px;border-radius:12px;gap:2px}
.seg button{padding:6px 13px;border-radius:9px;font-weight:650;font-size:13px;color:var(--ink-2);min-height:30px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* ===== Progress ===== */
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;width:var(--p,0%);background:var(--c,var(--accent));border-radius:inherit;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.tall{height:12px}.bar.thin{height:5px}
.bar.mark::after{content:"";position:absolute;top:-2px;bottom:-2px;left:var(--m,100%);width:2px;background:var(--ink-3);opacity:.7}

/* ===== Checkbox & rows ===== */
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s,transform .1s;color:#fff;background:var(--surface)}
.ck svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:.15s}
.ck:hover{border-color:var(--c,var(--accent))}
.ck.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.ck.on svg{opacity:1;transform:none}
.ck:active{transform:scale(.88)}
.ck.sq{border-radius:7px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:relative}
.item:last-child{border-bottom:0}
.item.click{cursor:pointer}
.item.click:hover{background:var(--surface-2)}
.item .t{font-weight:600;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.item .m{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:3px;font-size:12.5px;color:var(--ink-3)}
.item.done .t{text-decoration:line-through;color:var(--ink-3)}
.group-h{padding:10px 16px 6px;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.group-h .cnt{color:var(--ink-3);font-weight:600}
.group-h.bad{color:var(--bad)}

/* ===== Forms ===== */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fld{grid-column:1/-1;min-width:0}
.fld.half{grid-column:auto}
.fld>label{display:block;font-weight:650;font-size:13px;margin-bottom:6px}
.fld>label em{font-style:normal;font-weight:500;color:var(--ink-3);margin-left:6px}
.fld small{display:block;margin-top:5px;color:var(--ink-3);font-size:12.5px;line-height:1.4}
.in,.fld input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),.fld select,.fld textarea,.inp{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--surface);color:var(--ink);transition:border-color .12s,box-shadow .12s}
.fld textarea,textarea.in{resize:vertical;line-height:1.5}
.in:focus,.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.in.sm{min-height:34px;padding:5px 10px;font-size:14px}
select.in{padding-right:8px}
input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw label{cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0;inset:0}
.sw i{display:block;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.sw input:checked+i{outline:3px solid var(--ink);outline-offset:2px}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{cursor:pointer;position:relative}
.days input{position:absolute;opacity:0;inset:0}
.days span{display:grid;place-items:center;min-width:44px;height:38px;padding:0 8px;border-radius:10px;border:1px solid var(--line-2);font-weight:650;font-size:13px;background:var(--surface)}
.days input:checked+span{background:var(--accent);color:var(--on-accent);border-color:transparent}

.emo{display:flex;flex-direction:column;gap:8px}

.emo-l{display:flex;flex-wrap:wrap;gap:2px;max-height:104px;overflow:auto}
.emo-l button{width:36px;height:36px;border-radius:9px;font-size:20px;line-height:1}
.emo-l button:hover{background:var(--sunk)}
.tog{position:relative;display:inline-block;width:46px;height:28px;flex:none}
.tog input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.tog i{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:background .15s;pointer-events:none}
.tog i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.tog input:checked+i{background:var(--accent)}

.le{display:flex;flex-direction:column;gap:8px}
.le-row{display:flex;gap:8px;align-items:center}
.le-row .in{flex:1;min-width:0}

.setrow .sl{font-weight:650}
.setrow .sd{font-size:13px;color:var(--ink-3);margin-top:1px}
.setrow .in{width:auto;min-width:130px}

/* ===== Modal, menu, toast ===== */
.mback{position:fixed;inset:0;z-index:100;background:rgba(8,14,28,.52);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .18s;-webkit-}
.mback.in{opacity:1}
.modal{width:min(560px,100%);max-height:min(90vh,880px);max-height:min(90dvh,880px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r3);box-shadow:var(--pop);transform:translateY(12px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.mback.in .modal{transform:none}
.modal.sm{width:min(420px,100%)}.modal.lg{width:min(820px,100%)}.modal.xl{width:min(1040px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 6px 22px}
.mb{padding:8px 22px 22px;overflow:auto;overscroll-behavior:contain;flex:1}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:12px 22px calc(14px + var(--safe-b));border-top:1px solid var(--line);flex-wrap:wrap}
.mf .left{margin-right:auto}
@media(max-width:700px){
  .mback{align-items:flex-end;padding:0}
  .modal,.modal.sm,.modal.lg,.modal.xl{width:100%;max-height:94dvh;border-radius:22px 22px 0 0;transform:translateY(60px)}
  .form{grid-template-columns:minmax(0,1fr)}
  .fld.half{grid-column:1/-1}
  .fld.half.keep{grid-column:auto}
  .form.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.menu{position:fixed;z-index:130;min-width:200px;max-width:300px;background:var(--surface);border-radius:14px;box-shadow:var(--pop);padding:6px;max-height:70vh;overflow:auto}
.menu button,.menu a{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:9px;text-align:left;color:var(--ink);font-weight:600;text-decoration:none!important}
.menu button:hover,.menu a:hover,.menu .on{background:var(--sunk)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .dng{color:var(--bad)}
#toasts{position:fixed;left:0;right:0;bottom:calc(20px + var(--safe-b));z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
@media(max-width:899px){#toasts{bottom:calc(86px + var(--safe-b))}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;box-shadow:var(--pop);animation:tin .22s cubic-bezier(.2,.8,.2,1);max-width:min(460px,100%)}
.toast .lnk{color:var(--sun)}
.toast.out{opacity:0;transform:translateY(8px);transition:.25s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* ===== Misc ===== */
.av{width:var(--s,40px);height:var(--s,40px);border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:calc(var(--s,40px)*.4);overflow:hidden;flex:none;font-family:var(--font-h)}
.av img{width:100%;height:100%;object-fit:cover}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:650;color:var(--ink-3);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.xscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.acc{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);overflow:hidden}
.acc details{border-bottom:1px solid var(--line)}
.acc details:last-child{border-bottom:0}
.acc summary{padding:14px 18px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .15s}
.acc details[open] summary::after{transform:rotate(-135deg)}
.acc .acc-b{padding:0 18px 16px;color:var(--ink-2)}
.acc .acc-b p+p,.acc .acc-b ul+p,.acc .acc-b p+ul{margin-top:8px}
.acc .acc-b ul,.acc .acc-b ol{padding-left:20px;list-style:revert}
.acc .acc-b li{margin:3px 0}
.hr{height:1px;background:var(--line);border:0;margin:6px 0}
.sticky-note{position:fixed;z-index:60}
#mini{position:fixed;z-index:45;left:284px;bottom:16px}
@media(max-width:899px){#mini{left:12px;bottom:calc(76px + var(--safe-b))}}
.mini{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:var(--pop);font-variant-numeric:tabular-nums}
.mini b{font-size:16px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r2);background:color-mix(in srgb,var(--sun) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--sun) 50%,var(--line))}
.banner .grow{min-width:200px}
@media print{.side,.topbar,.bnav,.fab,#mini,.foot{display:none!important}.app{display:block}.main{padding:0}}

/* ===== Bloqueo con PIN ===== */
#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lk{width:100%;max-width:320px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.lk-logo{font-size:40px;line-height:1}
.lk-dots{display:flex;gap:10px;margin:6px 0;height:16px}
.lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2)}
.lk-dots i.on{background:var(--accent);border-color:var(--accent)}
.lk-msg{min-height:20px}
.lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.lk-pad button{height:58px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font:700 22px var(--font-h)}
@media(hover:hover){.lk-pad button:hover{background:var(--sunk)}}
.lk-pad .go{background:var(--accent);color:var(--on-accent);border-color:transparent}

/* ===== Titi: botón flotante y panel ===== */
.tfab{position:fixed;right:16px;bottom:calc(144px + var(--safe-b));z-index:50;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -6px rgba(14,26,47,.45);transition:transform .15s,background .2s}
@media(min-width:900px){.tfab{bottom:24px;right:24px}}
.tfab:hover{transform:scale(1.06)}
.tfab.off{background:var(--ink);color:var(--bg)}
.tfab.wake{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent),0 8px 24px -6px rgba(14,26,47,.45);animation:tpulse 2.2s infinite}
.tfab.await,.tfab.once{background:var(--bad);color:#fff;animation:tpulse 1s infinite}
html[data-theme=dark] .tfab.await,html[data-theme=dark] .tfab.once{color:#0A111F}
@keyframes tpulse{70%{box-shadow:0 0 0 14px transparent,0 8px 24px -6px rgba(14,26,47,.45)}100%{box-shadow:0 0 0 0 transparent,0 8px 24px -6px rgba(14,26,47,.45)}}
.tp{position:fixed;z-index:60;right:16px;left:16px;bottom:calc(210px + var(--safe-b));max-height:min(calc(100vh - 290px),560px);min-height:260px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--pop);overflow:hidden}
@media(min-width:900px){.tp{left:auto;right:24px;bottom:92px;width:390px;max-height:min(70vh,560px)}}
.tp-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tp-t{display:flex;align-items:center;gap:10px}.tp-t small{display:block;color:var(--ink-2);font-size:12px}
.tp-av{width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,var(--surface));display:flex;align-items:center;justify-content:center;font-size:18px}
.tp-log{flex:1;min-height:120px;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tm{max-width:88%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.tm.titi{background:var(--sunk);align-self:flex-start;border-bottom-left-radius:4px}
.tm.titi.no{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.tm.me{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-bottom-right-radius:4px}
.tp-live{min-height:0;padding:0 14px;color:var(--ink-2);font-size:13px;font-style:italic}
.tp-live:not(:empty){padding-bottom:6px}
.tp-form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.tp-form .in{flex:1;min-width:0}
.tp-form .mic{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);font-size:18px}
.tp-form .mic.on{background:var(--bad);color:#fff}
.tp-ex{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.tp-ex::-webkit-scrollbar{display:none}
.tp-ex .chipbtn{flex:none;font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tp-wk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}

/* ===== Utilidades y piezas compartidas ===== */
.mob{display:none}
@media(max-width:899px){.mob{display:grid}.desk{display:none!important}}
html.fs-l body{font-size:17px}
html.fs-l .btn,html.fs-l .tab{font-size:16px}
@keyframes ringin{from{stroke-dashoffset:var(--full)}}
.ra{animation:ringin .9s cubic-bezier(.2,.8,.2,1) both}
.hide-s{}
@media(max-width:560px){.hide-s{display:none}}
.optl{font-weight:500;color:var(--ink-3);font-style:normal;font-size:12px;margin-left:6px}
hr.sp{border:0;border-top:1px solid var(--line);margin:14px 0}
.stats{align-items:stretch}
.stat .k{font-size:13px;color:var(--ink-2);display:block}
.stat>b{display:block;font:800 26px/1.15 var(--font-h);letter-spacing:-.02em;margin-top:4px}
.sec{margin-top:6px}
.tabpane{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.tbl-w{overflow-x:auto;-webkit-overflow-scrolling:touch}
.banner.warn{background:color-mix(in srgb,var(--sun) 22%,var(--surface))}
.banner.study{background:color-mix(in srgb,var(--c-study) 10%,var(--surface));border-color:color-mix(in srgb,var(--c-study) 30%,var(--line));margin-bottom:0}
.v2{font:800 28px/1 var(--font-h);letter-spacing:-.02em}
.v2 small{font-size:14px;font-weight:600;color:var(--ink-3)}
.big{width:56px!important;height:56px!important;font-size:28px!important}
.add-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:160px;border-style:dashed;border-width:1.5px;border-color:var(--line-2);background:transparent;color:var(--ink-2);font-weight:650;cursor:pointer}
.add-card:hover{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface))}

/* ===== Gráficos de barras ===== */
.bars{display:flex;align-items:flex-end;gap:6px;height:calc(var(--h,120px) + 26px);padding-top:6px}
.bcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;position:relative}
.bcol em{font-style:normal;font-size:10.5px;color:var(--ink-3);font-weight:650;white-space:nowrap;min-height:13px}
.bv{width:100%;max-width:38px;height:var(--h,120px);display:flex;align-items:flex-end;justify-content:center;background:var(--sunk);border-radius:8px 8px 4px 4px;overflow:hidden}
.bv>i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:0;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bv.two{gap:3px;background:transparent;padding:0 2px}
.bv.two>i{border-radius:5px 5px 2px 2px;min-height:2px}
.bcol>span{font-size:11.5px;color:var(--ink-3);font-weight:600;line-height:1}
.bcol.now>span{color:var(--ink);font-weight:800}
.bcol.now .bv{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.bars.dense{gap:2px}.bars.dense .bv{max-width:14px;border-radius:4px 4px 2px 2px}.bars.dense .bcol>span{font-size:10px}
.bars.pair .bv{max-width:46px}
.bars.wk .bv{max-width:42px}

/* ===== Tareas ===== */
.qadd{display:flex;gap:8px}
.qadd .in{flex:1;min-height:46px;font-size:15.5px}
.qadd .btn{min-height:46px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);padding:10px;min-height:160px;transition:border-color .12s,background .12s}
.kcol.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface-2))}
.kcol>header{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.kbody{display:flex;flex-direction:column;gap:8px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:grab;box-shadow:0 1px 2px rgba(14,26,47,.04)}
.kcard:hover{border-color:var(--line-2)}
.kcard.drag{opacity:.45}
.kcard.done .t,.kcard.done>div:first-child .t{text-decoration:line-through;color:var(--ink-3)}
.kcard .m{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.kmove{display:flex;justify-content:space-between}
.kempty{border:1.5px dashed var(--line-2);border-radius:12px;padding:18px;text-align:center;color:var(--ink-3);font-size:13px}
@media(max-width:899px){
  .board{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(260px,82%);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .kcol{scroll-snap-align:start}
}

/* ===== Hábitos ===== */
.hab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.hab+.hab{margin-top:10px}
.hab-main{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 280px}
.hab-t{display:flex;align-items:center;gap:12px;text-align:left;min-width:0;flex:1}
.hab-t .t{display:block;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.hab-t .m{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.hab.done .hab-t .t{color:var(--ink-2)}
.hab-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface))}
.wstrip{display:flex;gap:5px}
.wd{width:40px;height:50px;border-radius:11px;border:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--surface);color:var(--ink-2);transition:background .12s,transform .08s}
.wd small{font-size:10.5px;font-weight:700;color:var(--ink-3);line-height:1}
.wd span{font-size:14px;font-weight:700;line-height:1.2}
.wd.on{background:var(--c,var(--accent));border-color:transparent;color:#fff}
.wd.on small{color:rgba(255,255,255,.85)}
.wd.off:not(.on){background:var(--surface-2);border-style:dashed;opacity:.6}
.wd.today:not(.on){border-color:var(--ink);border-width:2px}
.wd:disabled{opacity:.35;cursor:default}
.wd:not(:disabled):active{transform:scale(.92)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}
.heat i{width:100%;aspect-ratio:1;min-width:10px;border-radius:3px;background:var(--sunk);display:block}
.heat i.on{background:var(--c,var(--accent))}
.heat i.miss{background:color-mix(in srgb,var(--bad) 22%,var(--surface))}
.heat i.off{background:var(--surface-2);opacity:.7}
.heat i.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hsw{width:12px;height:12px;border-radius:3px;display:inline-block;margin:0 4px 0 10px;background:var(--sunk)}
.hsw.on{background:var(--c,var(--accent))}.hsw.miss{background:color-mix(in srgb,var(--bad) 22%,var(--surface))}.hsw.off{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
@media(max-width:560px){.wstrip{width:100%;justify-content:space-between}.wd{width:auto;flex:1}}

/* ===== Universidad ===== */
.steps{display:flex;flex-direction:column;gap:12px;counter-reset:st}
.steps li{display:grid;grid-template-columns:34px 1fr;column-gap:12px;counter-increment:st}
.steps li::before{content:counter(st);grid-row:span 2;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800}
.steps li span{color:var(--ink-2);font-size:14px}
.cls-row{padding:8px 0;border-bottom:1px solid var(--line)}
.cls-row:last-child{border-bottom:0}
.cls-row.past{opacity:.85}
.cls-row.now{background:color-mix(in srgb,var(--ok) 8%,transparent);margin:0 -10px;padding:8px 10px;border-radius:10px}
.ccard{position:relative;overflow:hidden;padding-top:22px}
.cbar{position:absolute;left:0;right:0;top:0;height:6px;background:var(--c,var(--accent))}
.tt{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.tt-d{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.tt-d.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tt-d>header{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.cls{display:flex;flex-direction:column;gap:1px;text-align:left;padding:8px 9px;border-radius:10px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));font-size:12.5px;line-height:1.3}
.cls b{font-size:12.5px}
.cls small{color:var(--ink-3)}
.cls.now{box-shadow:0 0 0 2px var(--ok)}
@media(max-width:899px){.tt{grid-template-columns:minmax(0,1fr)}.tt-d{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:flex-start}.tt-d>header{flex:0 0 100%}.tt-d .cls{flex:1 1 160px}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{text-align:center;font-size:12px;font-weight:700;color:var(--ink-3);padding:6px 0}
.cal-d{min-height:96px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:5px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;align-items:stretch}
.cal-d:hover{border-color:var(--ink-3)}
.cal-d.empty-d{background:transparent;border-color:transparent;pointer-events:none}
.cal-d.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dn{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.cal-d.today .dn{color:var(--accent)}
.evs{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev{display:block;font-size:11px;line-height:1.3;padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface));color:color-mix(in srgb,var(--c,var(--accent)) 50%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.done{text-decoration:line-through;opacity:.9}
.ev.more,.ev.tk{background:var(--sunk);color:var(--ink-2)}
.evd{display:none;gap:3px;flex-wrap:wrap}

@media(max-width:700px){.cal-d{min-height:54px;align-items:center}.evs{display:none}.evd{display:flex;justify-content:center}.cal{gap:3px}}

/* ===== Estudio ===== */
.deck{display:flex;flex-direction:column;gap:2px}
.dk-main{display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:12px;min-width:0}
.dk-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c-study) 14%,var(--surface));flex:none}
.cadd{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
@media(max-width:700px){.cadd{grid-template-columns:1fr}}
.gen-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.gen-item+.gen-item{margin-top:8px}
.gen-item.off{opacity:.5}
.gen-item .ck{margin-top:6px}
.gen-item textarea{resize:vertical}
.pm{position:relative;width:min(260px,100%);margin:6px auto}
.pm svg{width:100%;height:auto;display:block}
.pm-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 34px}
#pm-time{font:800 clamp(44px,12vw,58px)/1 var(--font-h);letter-spacing:-.03em}
.pm-go{min-width:170px}
.cyc{display:flex;gap:8px;justify-content:center}
.cyc i{width:11px;height:11px;border-radius:50%;background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.cyc i.on{background:var(--c-study);box-shadow:none}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--sunk)}
.stackbar i{display:block;min-width:0}
.modeb{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);transition:border-color .12s,background .12s}
.modeb:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.modeb .mi{font-size:26px;flex:none}
.modeb b{display:block}
.modeb small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px;line-height:1.4}

#room:empty{display:none}
.room{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column}
.rh{display:flex;align-items:center;gap:12px;padding:12px clamp(12px,3vw,28px);border-bottom:1px solid var(--line);background:var(--surface)}
.rb{flex:1;overflow:auto;padding:clamp(16px,4vw,40px) clamp(14px,3vw,28px) calc(40px + var(--safe-b))}
.rw{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:clamp(20px,5vw,36px);box-shadow:0 12px 30px -18px rgba(14,26,47,.25)}
.rq{font:700 clamp(19px,3.6vw,26px)/1.35 var(--font-h);letter-spacing:-.01em;overflow-wrap:anywhere}
.rans{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;overflow-wrap:anywhere;white-space:pre-wrap}
.rans.you{background:var(--surface-2)}
.rans.okb{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.rans.badb{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:14px;border:2px solid var(--line-2);background:var(--surface);position:relative}
.gbtn b{font-size:15px}
.gbtn small{color:var(--ink-3);font-size:12px}
.gbtn kbd{position:absolute;top:5px;right:6px;font-size:10px;padding:0 4px}
.gbtn.bad:hover{border-color:var(--bad)}.gbtn.warn:hover{border-color:var(--warn)}.gbtn.ok:hover{border-color:var(--ok)}
.gbtn.sug{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line-2);background:var(--surface);font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt:disabled{cursor:default}
@media(max-width:480px){.grades{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== Notas ===== */
.nv{display:flex;flex-direction:column;gap:16px}
.notes-wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.nlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;position:sticky;top:70px}
.nl-h{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.nl-h .in{min-height:38px}.nl-h select{max-width:120px}
.nl-b{max-height:calc(100vh - 220px);overflow:auto}
.nitem{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
.nitem:last-child{border-bottom:0}
.nitem:hover{background:var(--surface-2)}
.nitem.on{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.nitem .ni{font-size:20px;line-height:1.3}
.nitem .nt{display:block;font-weight:700}.nitem .ns{display:block;font-size:13px;color:var(--ink-2)}.nitem .nm{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.nedit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);min-height:60vh}
.nedit>.empty{border:0}
.ehead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.nback{display:none}
.ebody{padding:clamp(16px,3vw,32px) clamp(16px,4vw,48px) 40px;max-width:820px;margin:0 auto}
.etitle{display:flex;align-items:center;gap:10px}
.eicon{width:52px;height:52px;border-radius:14px;font-size:30px;display:grid;place-items:center;flex:none}
.eicon:hover{background:var(--sunk)}
.n-title{flex:1;min-width:0;border:0;outline:0;background:transparent;font:800 clamp(24px,4vw,34px)/1.2 var(--font-h);letter-spacing:-.025em;color:var(--ink);padding:6px 0}
.n-title::placeholder{color:var(--ink-3);opacity:.6}
.emeta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.etools{display:flex;gap:2px;align-items:center;flex-wrap:wrap;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:14px;position:sticky;top:60px;z-index:5}
.etools button{min-width:34px;height:32px;border-radius:8px;font-weight:700;font-size:14px}
.etools button:hover{background:var(--sunk)}
.etools .faint{margin-left:auto;padding:0 8px}
.ed{display:flex;flex-direction:column;gap:2px}
.blk{display:flex;align-items:flex-start;gap:2px;position:relative;border-radius:6px;padding-left:26px}
.blk .bh{position:absolute;left:-2px;top:4px;width:24px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--ink-3);opacity:0;cursor:grab;transition:opacity .12s}
.blk:hover .bh,.blk:focus-within .bh{opacity:.8}
.blk .bh:hover{background:var(--sunk)}
@media(hover:none){.blk .bh{opacity:.55}}
.blk.dragging{opacity:.4}
.blk.dropb::before,.blk.dropa::after{content:"";position:absolute;left:26px;right:0;height:3px;border-radius:3px;background:var(--accent)}
.blk.dropb::before{top:-2px}.blk.dropa::after{bottom:-2px}
.bc{flex:1;min-width:0;outline:0;padding:4px 4px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap;min-height:1.65em;border-radius:5px}
.bc:empty::before{content:attr(data-ph);color:var(--ink-3);opacity:0;pointer-events:none}
.bc:empty:focus::before,.blk[data-t="p"] .bc:empty:focus::before{opacity:.7}
.blk:not([data-t="p"]) .bc:empty::before{opacity:.55}
.bc b,.bc strong{font-weight:750}
.bc code{font:13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--sunk);padding:1px 6px;border-radius:5px}
.bc mark{background:color-mix(in srgb,var(--sun) 55%,transparent);color:inherit;padding:0 2px;border-radius:3px}
.bp{flex:none;padding:4px 0 0;min-width:22px;text-align:center;color:var(--ink-2);line-height:1.65}
.bp.num{min-width:26px;font-variant-numeric:tabular-nums}
.blk[data-t="h1"] .bc{font:800 29px/1.3 var(--font-h);letter-spacing:-.02em;padding-top:14px}
.blk[data-t="h2"] .bc{font:750 23px/1.3 var(--font-h);letter-spacing:-.015em;padding-top:10px}
.blk[data-t="h3"] .bc{font:700 18px/1.4 var(--font-h);padding-top:8px}
.blk[data-t="quote"] .bc{border-left:3px solid var(--ink);padding-left:14px;font-size:16.5px;color:var(--ink-2)}
.blk[data-t="code"] .bc{font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--sunk);padding:12px 14px;border-radius:10px;white-space:pre-wrap}
.blk[data-t="callout"]{background:color-mix(in srgb,var(--sun) 16%,var(--surface));border-radius:12px;padding:8px 12px 8px 30px;margin:3px 0}
.blk[data-t="callout"] .bh{left:2px}
.blk[data-t="callout"] .bp{font-size:18px;padding-top:3px}
.blk[data-t="hr"]{align-items:center;padding-top:8px;padding-bottom:8px}
.blk[data-t="hr"] hr{flex:1;border:0;border-top:1px solid var(--line-2);margin:0}
.blk[data-t="todo"] .ck{width:20px;height:20px;margin:6px 8px 0 4px}
.blk[data-t="todo"] .ck svg{width:12px;height:12px}
.blk.done .bc{text-decoration:line-through;color:var(--ink-3)}
.addblk{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 26px;color:var(--ink-3);font-size:14px;border-radius:8px;opacity:.7}
.addblk:hover{opacity:1;background:var(--surface-2)}
.menu.slash{min-width:230px}
.slash .si{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);font-size:13px;font-weight:700;flex:none}
.slash button.on{background:var(--sunk)}
.tplc{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);transition:border-color .12s,transform .1s}
.tplc:hover{border-color:var(--accent);transform:translateY(-1px)}
.tplc .ti{font-size:26px}.tplc small{color:var(--ink-2);font-size:12.5px;line-height:1.35}
@media(max-width:899px){
  .notes-wrap{grid-template-columns:minmax(0,1fr)}
  .nlist{position:static}.nl-b{max-height:none}
  .nv.has-open .nlist,.nv.has-open .ph,.nv.has-open .tip{display:none}
  .nv:not(.has-open) .nedit{display:none}
  .nback{display:grid}
  .etools{top:56px}
  .etools .faint{display:none}
  .nedit{min-height:0}
}

/* ===== Metas y Diario ===== */
.goal{display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--c)}
.goal.done{opacity:.85}
.g-top{display:flex;gap:12px;align-items:flex-start}
.g-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:23px;flex:none}
.g-t{font:700 17px/1.3 var(--font-h);overflow-wrap:anywhere;margin-bottom:5px}
.g-why{font-style:italic}
.g-bar{display:flex;align-items:center;gap:12px}.g-bar .bar{flex:1}.g-bar b{font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.gsteps{display:flex;flex-direction:column;gap:7px}
.gsteps li{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.gsteps li .ck{width:20px;height:20px;margin-top:1px}.gsteps li .ck svg{width:12px;height:12px}
.gsteps li.on span{text-decoration:line-through;color:var(--ink-3)}
.g-manual{flex-wrap:wrap}
.wrow label{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px;font-size:14px}
.wrow label b{font-variant-numeric:tabular-nums;color:var(--accent)}
.jnav{padding:6px 0}.jnav .ibtn[disabled]{opacity:.3;pointer-events:none}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.moods button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2)}
.moods button span{font-size:28px;line-height:1.2;filter:grayscale(.7);opacity:.7;transition:.15s}
.moods button small{font-size:11px;color:var(--ink-3)}
.moods button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.moods button.on span{filter:none;opacity:1;transform:scale(1.15)}
.energy{display:flex;gap:6px;margin-top:10px}
.energy button{font-size:26px;line-height:1;padding:8px;border-radius:12px;filter:grayscale(1);opacity:.35;transition:.15s}
.energy button.on{filter:none;opacity:1}
.j-mood{font-size:26px}

/* ===== Inicio ===== */
.homehero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--surface) 60%)}
.hero-l{display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}

.hero-r{display:grid;place-items:center}
.legend{display:flex;flex-direction:column;gap:2px;margin-top:6px;max-width:340px}

.gpano{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.pano{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r2);background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none!important;transition:transform .12s,border-color .12s,box-shadow .12s;min-width:0}
.pano:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 10px 24px -16px var(--c)}
.pa-h{display:flex;align-items:center;gap:8px;color:var(--ink-3)}
.pa-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.pa-t{font-weight:700;color:var(--ink-2);flex:1}
.pa-big{font:800 26px/1.15 var(--font-h);letter-spacing:-.02em}

.pano .bar{margin-top:4px}
.lv-badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--sun);color:#3a2800;font:800 24px var(--font-h);flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.bdg{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface-2);border:1px solid var(--line)}

.bd .bi{font-size:26px}.bd small{color:var(--ink-2);font-size:12px;line-height:1.35}
.start .bar{margin:12px 0 4px}

.st{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);font-weight:600;text-decoration:none!important}

.in.lg{min-height:48px;font-size:16.5px}

function readForm(form,fields){

    if(f.type==='check'){const i=form.elements[f.name];o[f.name]=!!(i&&i.checked);return;}
    const el=form.elements[f.name];if(!el)return;
    let val=el.value;
    if(f.type==='number'){val=val===''?'':num(val);}else if(typeof val==='string'&&f.type!=='textarea'){val=val.trim();}
    o[f.name]=val;
  });

function ringSvg(p,{size=96,stroke=10,color='var(--accent)',text='',sub='',anim=false}={}){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-clamp(p,0,1)),h=size/2;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${Math.round(p*100)}%"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="${stroke}"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${h} ${h})"${anim?` class="ra" style="--full:${c}"`:''}/>${text?`<text x="50%" y="${sub?'46%':'50%'}" text-anchor="middle" dominant-baseline="central" font-weight="800" font-size="${size*.25}" fill="var(--ink)" font-family="var(--font-h)">${text}</text>`:''}${sub?`<text x="50%" y="66%" text-anchor="middle" dominant-baseline="central" font-size="${size*.12}" fill="var(--ink-3)">${sub}</text>`:''}</svg>`;
}
function ringsMulti(list,{size=210,stroke=15,gap=6,anim=false,text='',sub=''}={}){
  const h=size/2;
  const rings=list.map((it,i)=>{
    const r=h-stroke/2-i*(stroke+gap),c=2*Math.PI*r,p=it.p==null?0:clamp(it.p,0,1);
    return `<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="color-mix(in srgb,${it.color} 16%,var(--sunk))" stroke-width="${stroke}"/>`+
      (p>0?`<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 ${h} ${h})"${anim?` class="ra" style="--full:${c};animation-delay:${i*120}ms"`:''}/>`:'');
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px" role="img" aria-label="Progreso de hoy">${rings}${text?`<text x="50%" y="${sub?'47%':'50%'}" text-anchor="middle" dominant-baseline="central" font-weight="800" font-size="${size*.21}" fill="var(--ink)" font-family="var(--font-h)">${text}</text>`:''}${sub?`<text x="50%" y="62%" text-anchor="middle" dominant-baseline="central" font-size="${size*.062}" fill="var(--ink-3)">${sub}</text>`:''}</svg>`;
}
function donutSvg(segs,{size=170,stroke=28,text='',sub=''}={}){
  const tot=sum(segs,s=>s.v);const h=size/2,r=(size-stroke)/2,c=2*Math.PI*r;let acc=0;
  const live=segs.filter(s=>s.v>0);const gap=live.length>1?2.5:0;
  const arcs=tot>0?live.map(s=>{const part=s.v/tot*c;const len=Math.max(0.5,part-gap);const o=`<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${stroke}" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${h} ${h})"><title>${esc(s.l)}</title></circle>`;acc+=part;return o;}).join(''):`<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="${stroke}"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px" role="img" aria-label="${esc(text?text+(sub?' '+sub:''):'Gráfico circular')}">${arcs}${text?`<text x="50%" y="${sub?'46%':'50%'}" text-anchor="middle" dominant-baseline="central" font-weight="800" font-size="${size*.15}" fill="var(--ink)" font-family="var(--font-h)">${text}</text>`:''}${sub?`<text x="50%" y="62%" text-anchor="middle" dominant-baseline="central" font-size="${size*.075}" fill="var(--ink-3)">${sub}</text>`:''}</svg>`;
}
function radarSvg(labels,vals,prev,{size=360,max=10}={}){
  const cx=size/2,cy=size/2,R=size/2-62,n=labels.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;const r=R*v/max;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const poly=arr=>arr.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');
  let g='';
  for(let k=2;k<=max;k+=2)g+=`<polygon points="${poly(labels.map(()=>k))}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  labels.forEach((l,i)=>{const [x,y]=pt(i,max);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`;const [lx,ly]=pt(i,max+1.55);const anc=lx<cx-6?'end':lx>cx+6?'start':'middle';g+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anc}" dominant-baseline="central" font-size="12.5" font-weight="600" fill="var(--ink-2)">${esc(l)}</text>`;});
  if(prev)g+=`<polygon points="${poly(prev)}" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-dasharray="4 4"/>`;
  g+=`<polygon points="${poly(vals)}" fill="color-mix(in srgb,var(--accent) 24%,transparent)" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{const [x,y]=pt(i,v);g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="var(--accent)"/>`;});
  return `<svg viewBox="-44 0 ${size+88} ${size}" width="100%" style="max-width:${size+88}px" role="img" aria-label="Rueda de la vida">${g}</svg>`;
}
function barsHtml(items,{h=120,max,fmt,cls='',vals=false}={}){
  const mx=max||Math.max(1,...items.map(i=>i.v||0));
  return `<div class="bars ${cls}" style="--h:${h}px">${items.map(i=>`<div class="bcol${i.now?' now':''}" title="${esc(i.tip||(i.l+': '+(fmt?fmt(i.v):i.v)))}">${vals?`<em>${i.v?esc(fmt?fmt(i.v):i.v):''}</em>`:''}<div class="bv"><i style="height:${clamp((i.v||0)/mx,0,1)*100}%;${i.c?`background:${i.c}`:''}"></i></div><span>${esc(i.l)}</span></div>`).join('')}</div>`;
}
function barsPair(items,{h=130,fmt}={}){
  const mx=Math.max(1,...items.map(i=>Math.max(i.a||0,i.b||0)));
  return `<div class="bars pair" style="--h:${h}px">${items.map(i=>`<div class="bcol${i.now?' now':''}" title="${esc(i.l)}: ${esc(i.ta||'')} / ${esc(i.tb||'')}"><div class="bv two"><i style="height:${clamp((i.a||0)/mx,0,1)*100}%;background:var(--ok)"></i><i style="height:${clamp((i.b||0)/mx,0,1)*100}%;background:var(--bad)"></i></div><span>${esc(i.l)}</span></div>`).join('')}</div>`;
}

function render(nav){
  const v=VIEWS[route]||VIEWS.home;const main=$('#main');
  const y=window.scrollY,ae=document.activeElement;
  const fid=ae&&ae.id&&main.contains(ae)?ae.id:null;

  UI._nav=!!nav;
  try{main.innerHTML=`<div class="page" data-view="${route}">${v.render()}</div>`;}
  catch(err){console.error(err);main.innerHTML=`<div class="page">${empty('⚠️','Algo falló en esta pantalla',esc(err.message||err),'<a class="btn primary" href="#/home">Ir al inicio</a>')}</div>`;}

  if(!nav)window.scrollTo(0,y);
  if(fid){const n=document.getElementById(fid);if(n){n.focus({preventScroll:true});if(sel&&n.setSelectionRange)try{n.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
  UI._nav=false;
  fixHeadings(main);
  try{checkBadges();}catch(e){}
}
/* Orden de encabezados válido para lectores de pantalla (sin cambiar el aspecto) */
function fixHeadings(root){
  let prev=1;
  root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{
    const l=+h.tagName[1];
    if(l>prev+1){h.setAttribute('aria-level',String(prev+1));prev=prev+1;}else{h.removeAttribute('aria-level');prev=l;}
  });
}

document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el,e);});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e);});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(_menu){closeMenu();return;}if(modalStack.length){closeModal();e.preventDefault();return;}}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();A.search();return;}
  const t=e.target;const typing=t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  if(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    if(e.key==='?'){go('help');}
    else if(e.key==='n'&&!modalStack.length){A.quick();e.preventDefault();}
    else if(e.key==='/'&&!modalStack.length){A.search();e.preventDefault();}
  }
});

   Tareas: lista agrupada, tablero Kanban, captura rápida y repeticiones
   ===================================================================== */
const PRIO=[['0','Sin prioridad'],['3','Alta'],['2','Media'],['1','Baja']];
const PRIO_C={3:'var(--bad)',2:'var(--warn)',1:'var(--ok)',0:'var(--ink-3)'};
const PRIO_L={3:'Alta',2:'Media',1:'Baja',0:''};
const REPEAT=[['','No se repite'],['daily','Todos los días'],['weekly','Cada semana'],['monthly','Cada mes']];
const tcat=id=>byId(S.taskCats,id);

function tasksBadge(){const t=today();return S.tasks.filter(x=>x.status!=='done'&&x.due&&x.due<=t).length;}
function tasksToday(){
  const t=today();
  const open=S.tasks.filter(x=>x.status!=='done'&&x.due&&x.due<=t).length;
  const done=S.tasks.filter(x=>x.status==='done'&&x.doneAt===t).length;
  return{open,done,total:open+done,p:(open+done)?done/(open+done):null};
}
function nextDue(t){
  const T=today(),base=t.due||T;
  if(t.repeat==='daily')return addDays(base<T?T:base,1);
  let d=base;
  const anchor=t.rday||parseD(base).getDate();
  const step=t.repeat==='weekly'?x=>addDays(x,7):x=>{const k=addMonths(monthKey(x),1);const day=Math.min(anchor,daysIn(k));return k+'-'+pad(day);};
  do{d=step(d);}while(d<=T);
  return d;
}
function setTaskDone(t,done){
  if(done){
    t.status='done';t.doneAt=today();t.doneTs=Date.now();
    if(t.repeat&&!t.spawned){
      const n=JSON.parse(JSON.stringify(t));
      Object.assign(n,{id:uid(),status:'todo',doneAt:'',due:nextDue(t),rday:t.repeat==='monthly'?(t.rday||parseD(t.due||today()).getDate()):undefined,created:today(),spawned:null,subs:(t.subs||[]).map(s=>({...s,id:uid(),d:false}))});
      delete n.doneTs;S.tasks.push(n);t.spawned=n.id;
    }
  }else{
    t.status='todo';t.doneAt='';
    if(t.spawned){const sp=byId(S.tasks,t.spawned);if(sp&&sp.status==='todo')S.tasks=S.tasks.filter(x=>x.id!==t.spawned);t.spawned=null;}
  }
}
function setTaskStatus(t,st){
  if(st==='done'){if(t.status!=='done')setTaskDone(t,true);}
  else{if(t.status==='done')setTaskDone(t,false);t.status=st;}
}
function parseQuick(text){
  let t=' '+text+' ',due='',prio=0,cat='',time='';
  t=t.replace(/\s!(alta|urgente|media|baja)\b/i,(m,p)=>{prio={alta:3,urgente:3,media:2,baja:1}[p.toLowerCase()];return' ';});
  t=t.replace(/\s#([\p{L}\d_-]+)/u,(m,c)=>{const f=S.taskCats.find(x=>norm(x.name).startsWith(norm(c)));if(f){cat=f.id;return' ';}return m;});
  const T=today();
  const rules=[[/\spasado mañana\b/i,2],[/\smañana\b/i,1],[/\shoy\b/i,0]];
  for(const [re,n] of rules){if(re.test(t)){due=addDays(T,n);t=t.replace(re,' ');break;}}
  if(!due){
    const m=t.match(/\s(?:el\s)?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\b/i);
    if(m){const idx=DOWS.findIndex(d=>norm(d)===norm(m[1]));let n=(idx-dow(T)+7)%7;if(n===0)n=7;due=addDays(T,n);t=t.replace(m[0],' ');}
  }
  if(!due){
    const m=t.match(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/);
    if(m&&+m[1]>=1&&+m[1]<=31&&+m[2]>=1&&+m[2]<=12){
      let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;
      let d=y+'-'+pad(m[2])+'-'+pad(m[1]);if(!m[3]&&d<T)d=(y+1)+'-'+pad(m[2])+'-'+pad(m[1]);due=d;t=t.replace(m[0],' ');
    }
  }
  const tm=t.match(/\s(?:a las\s)?(\d{1,2}):(\d{2})(?=\s)/);
  if(tm){time=pad(+tm[1])+':'+tm[2];t=t.replace(tm[0],' ');}
  return{title:t.replace(/\s+/g,' ').trim(),due,prio,cat,time:due?time:''};
}
const cmpTask=(a,b)=>(b.prio||0)-(a.prio||0)||(a.due||'9').localeCompare(b.due||'9')||(a.time||'').localeCompare(b.time||'')||(a.created||'').localeCompare(b.created||'');
const cmpDue=(a,b)=>(a.time||'99').localeCompare(b.time||'99')||(b.prio||0)-(a.prio||0)||(a.created||'').localeCompare(b.created||'');
function visibleTasks(){
  const u=ui('tasks',{});const q=norm(u.q||'');
  return S.tasks.filter(t=>{
    if(u.cat&&t.cat!==u.cat)return false;
    if(u.prio&&String(t.prio||0)!==u.prio)return false;
    if(q&&!norm(t.title+' '+(t.notes||'')).includes(q))return false;
    return true;
  });
}
function groupTasks(list){
  const T=today(),tm=addDays(T,1),wk=addDays(T,7);
  const g={late:[],today:[],tomorrow:[],week:[],later:[],none:[]};
  list.forEach(x=>{
    if(!x.due)g.none.push(x);else if(x.due<T)g.late.push(x);else if(x.due===T)g.today.push(x);else if(x.due===tm)g.tomorrow.push(x);else if(x.due<=wk)g.week.push(x);else g.later.push(x);
  });
  g.late.sort(cmpTask);g.none.sort(cmpTask);
  ['today','tomorrow','week','later'].forEach(k=>g[k].sort((a,b)=>a.due.localeCompare(b.due)||cmpDue(a,b)));
  return g;
}
function taskRow(t){

/* =====================================================================
   Hábitos: se crean una vez y aparecen cada día que les toca
   ===================================================================== */
const HT=[['any','En cualquier momento'],['am','Por la mañana'],['pm','Por la tarde'],['night','Por la noche']];
const activeHabits=()=>S.habits.filter(h=>!h.archived);
const habitSched=(h,d)=>d>=h.created&&(h.days||[]).includes(dow(d));
function habitStreak(h){
  const T=today();let d=T,s=0;
  if(habitSched(h,T)&&!h.log[T])d=addDays(T,-1);
  for(let i=0;i<4000;i++){
    if(d<h.created)break;
    if(habitSched(h,d)){if(h.log[d])s++;else break;}
    d=addDays(d,-1);
  }
  return s;
}
function habitBest(h){
  const T=today();let cur=0,best=0,d=h.created;
  for(let i=0;i<4000&&d<=T;i++,d=addDays(d,1)){
    if(!habitSched(h,d))continue;
    if(h.log[d]){cur++;best=Math.max(best,cur);}else if(d!==T)cur=0;
  }
  return best;
}
function habitRate(h,n){
  const T=today();let num=0,den=0;
  for(let i=0;i<n;i++){
    const d=addDays(T,-i);if(!habitSched(h,d))continue;
    if(d===T&&!h.log[d])continue;
    den++;if(h.log[d])num++;
  }
  return den?num/den:null;
}
const habitTotal=h=>Object.keys(h.log||{}).length;
function habitsToday(){
  const T=today();const list=activeHabits().filter(h=>habitSched(h,T));
  const done=list.filter(h=>h.log[T]).length;
  return{list,done,total:list.length,p:list.length?done/list.length:null};
}
const habitsBadge=()=>{const t=habitsToday();return t.total-t.done;};
const habitChecks=()=>sum(S.habits,h=>habitTotal(h));
function bestActiveStreak(){return Math.max(0,...activeHabits().map(habitStreak));}
function habitDaySeries(n){
  const T=today();const out=[];
  for(let i=n-1;i>=0;i--){
    const d=addDays(T,-i);const hs=activeHabits().filter(h=>habitSched(h,d));
    const done=hs.filter(h=>h.log[d]).length;
    out.push({date:d,total:hs.length,done,p:hs.length?done/hs.length:0});
  }
  return out;
}
/* Hábitos medibles: "check" (solo marcar), "count" (vasos, guineos…) o "min" (minutos).
   El progreso parcial vive en h.prog[fecha]; h.log[fecha]=1 solo cuando se llega a la meta,
   así la racha y los porcentajes funcionan igual que siempre. */
const habitMeasured=h=>h.kind==='count'||h.kind==='min';
const habitAmt=(h,d)=>habitMeasured(h)?(Number(h.prog&&h.prog[d])||0):(h.log[d]?1:0);
const habitFmt=(h,n)=>h.kind==='min'?fmtMin(n):(n+(h.unit?' '+h.unit:''));
const habitProgTxt=(h,d)=>{const a=habitAmt(h,d),t=h.target||1;return h.kind==='min'?fmtMin(a)+' / '+fmtMin(t):a+'/'+t+(h.unit?' '+h.unit:'');};
const habitWeekAmt=h=>{const T=today();return weekDates(T).filter(d=>d<=T).reduce((t,d)=>t+habitAmt(h,d),0);};
function setHabitProg(h,d,v){
  v=Math.max(0,Math.min(99999,Math.round(Number(v)||0)));
  if(!h.prog)h.prog={};
  if(v>0)h.prog[d]=v;else delete h.prog[d];
  if(v>=(h.target||1)){h.log[d]=1;if(d<h.created)h.created=d;}else delete h.log[d];
}
function setHabitDay(h,d,on){
  if(habitMeasured(h)){setHabitProg(h,d,on?Math.max(h.target||1,habitAmt(h,d)):0);return;}
  if(on){h.log[d]=1;if(d<h.created)h.created=d;}else delete h.log[d];
}
function hprog(h){
  const T=today(),a=habitAmt(h,T),t=h.target||1,s=h.step||1;
  return `<div class="hprog"><button class="btn sm" type="button" data-a="habit-add" data-id="${h.id}" data-n="${-s}" aria-label="Restar ${esc(habitFmt(h,s))}"${a<=0?' disabled':''}>−${s}</button>${bar(a/t,h.color)}<button class="btn sm primary" type="button" data-a="habit-add" data-id="${h.id}" data-n="${s}" aria-label="Sumar ${esc(habitFmt(h,s))}">+${s}</button><button class="btn sm ghost" type="button" data-a="habit-amt" data-id="${h.id}" aria-label="Escribir cuánto llevo hoy">✎</button></div>`;
}
function quickCounters(){
  const T=today();const l=habitsToday().list.filter(habitMeasured);
  if(!l.length)return'';
  return `<section class="card qc"><h3>Mis contadores de hoy</h3><div class="qc-g">${l.map(h=>{const a=habitAmt(h,T),t=h.target||1,s=h.step||1,d=!!h.log[T];return `<div class="qc-i${d?' ok':''}" style="--c:${h.color}"><button class="qc-b" type="button" data-a="habit-add" data-id="${h.id}" data-n="${s}" aria-label="${esc(h.name)}: llevas ${esc(habitProgTxt(h,T))}. Tocar para sumar ${esc(habitFmt(h,s))}"><span class="qc-ic" aria-hidden="true">${esc(h.icon)}</span><span class="qc-n">${esc(h.name)}</span><span class="qc-v">${esc(habitProgTxt(h,T))}${d?' ✔':''}</span></button>${bar(a/t,h.color,'thin')}</div>`;}).join('')}</div><p class="faint tiny">Toca para sumar. Para restar o corregir, entra a Hábitos.</p></section>`;
}

/* =====================================================================
   Reto Prime: un reto de N días para ser tu mejor versión
   Un día "cuenta" si cumples al menos el % elegido de tus hábitos de ese día.
   ===================================================================== */
const primeOn=()=>!!(S.prime&&S.prime.on&&S.prime.start);
const primeMin=()=>(S.prime.min||80)/100;
function dayRatio(d){const hs=activeHabits().filter(h=>habitSched(h,d));return hs.length?hs.filter(h=>h.log[d]).length/hs.length:null;}
function primeOk(d){const r=dayRatio(d);return r!=null&&r>=primeMin()-1e-9;}
function primeInfo(){
  if(!primeOn())return null;
  const T=today(),st=S.prime.start,N=S.prime.days||30,end=addDays(st,N-1);
  const cells=[];let ok=0;
  for(let i=0;i<N;i++){
    const d=addDays(st,i);let cls='fut';
    if(d<=T){const r=dayRatio(d);cls=r==null?'off':(r>=primeMin()-1e-9?'ok':(d===T?'now':'miss'));}
    if(cls==='ok')ok++;cells.push({d,cls});
  }
  let best=0,run=0,streak=0;
  cells.forEach(c=>{if(c.cls==='ok'){run++;best=Math.max(best,run);}else if(c.cls==='miss')run=0;});
  for(let i=cells.length-1;i>=0;i--){const c=cells[i];if(c.cls==='fut'||c.cls==='now'||c.cls==='off')continue;if(c.cls==='ok')streak++;else break;}
  const hs=activeHabits().filter(h=>habitSched(h,T));const done=hs.filter(h=>h.log[T]).length;
  const need=Math.ceil(hs.length*primeMin()-1e-9);
  return{st,N,end,cells,ok,streak,best,day:diffDays(T,st)+1,over:T>end,done,total:hs.length,need,todayOk:hs.length>0&&done>=need};
}

const ATYPE=[['deber','📄','Deber'],['examen','📝','Examen'],['proyecto','🧪','Proyecto'],['lectura','📖','Lectura'],['exposicion','🎤','Exposición'],['otro','📌','Otro']];
const atype=k=>ATYPE.find(a=>a[0]===k)||ATYPE[5];
const ccourse=id=>byId(S.courses,id);

function classesOn(d){
  const w=dow(d);const out=[];
  S.courses.forEach(c=>(c.sched||[]).forEach(b=>{if(b.day===w)out.push({...b,course:c});}));
  return out.sort((a,b)=>a.start.localeCompare(b.start));
}
function nextClass(){
  const T=today(),nm=nowMin();
  for(let i=0;i<8;i++){
    const d=addDays(T,i);const cl=classesOn(d).filter(b=>i>0||hm2min(b.end)>nm);
    if(cl.length)return{...cl[0],date:d};
  }
  return null;
}
const pendingAsg=()=>S.assignments.filter(a=>a.status!=='done');
function nextAsg(days){
  const T=today(),lim=addDays(T,days);
  return pendingAsg().filter(a=>a.due&&a.due<=lim).sort((a,b)=>a.due.localeCompare(b.due)||(a.time||'').localeCompare(b.time||''));
}
function uniProgress(){
  const total=S.assignments.length,done=S.assignments.filter(a=>a.status==='done').length;
  return{total,done,p:total?done/total:null};
}

function classForm(courseId,blockId){
  if(!S.courses.length){toast('Primero agrega una materia');return;}
  let blk=null,cid=courseId;
  if(blockId){S.courses.forEach(c=>(c.sched||[]).forEach(b=>{if(b.id===blockId){blk=b;cid=c.id;}}));}
  const fields=[
    {name:'course',label:'Materia',type:'select',options:S.courses.map(c=>[c.id,c.name])},
    blk?{name:'day',label:'Día',type:'select',options:weekOrder().map(d=>[d,cap(DOWS[d])])}:{name:'days',label:'Días de clase',type:'days',hint:'Puedes elegir varios si la hora es la misma.'},
    {name:'start',label:'Desde',type:'time',half:true,keep:true,required:true},
    {name:'end',label:'Hasta',type:'time',half:true,keep:true,required:true},
    {name:'room',label:'Aula',opt:true,ph:'Si es distinta a la habitual'}];
  formModal({title:blk?'Editar clase':'Agregar clase al horario',fields,submit:blk?'Guardar':'Agregar',
    values:blk?{course:cid,day:blk.day,start:blk.start,end:blk.end,room:blk.room}:{course:cid||S.courses[0].id,days:[],start:'07:00',end:'09:00',room:''},
    del:blk?()=>{const c=ccourse(cid);c.sched=c.sched.filter(b=>b.id!==blockId);save();render();toast('Clase eliminada');}:null,
    onSubmit:v=>{
      if(hm2min(v.end)<=hm2min(v.start)){toast('La hora final debe ser después de la inicial');return false;}
      if(blk){
        const old=ccourse(cid);old.sched=old.sched.filter(b=>b.id!==blockId);
        ccourse(v.course).sched.push({id:blockId,day:Number(v.day),start:v.start,end:v.end,room:v.room});
      }else{
        if(!v.days.length){toast('Elige al menos un día');return false;}
        const c=ccourse(v.course);v.days.forEach(d=>c.sched.push({id:uid(),day:d,start:v.start,end:v.end,room:v.room}));
      }
      save();render();toast('Horario actualizado');
    }});
}

function uniCalMonth(){
  const u=ui('uni',{});const mk=u.calMonth||monthKey(today());const T=today();
  const first=mk+'-01';const off=(dow(first)-S.settings.weekStart+7)%7;const dim=daysIn(mk);

  const head=weekOrder().map(d=>`<div class="cal-h">${DOW3[d]}</div>`).join('');
  const body=cells.map(d=>{

/* ---- Repetición espaciada (SM-2 simplificado) ---- */
function schedule(card,g){
  let reps=card.reps||0,ease=card.ease||2.5,int=card.int||0,lapse=false;
  if(g===0){reps=0;int=0;ease=Math.max(1.3,ease-.2);lapse=true;}
  else{
    reps++;
    if(reps===1)int=g===3?4:g===2?2:1;
    else if(reps===2)int=g===3?7:g===2?4:2;
    else int=Math.max(int+1,Math.round(int*ease*(g===1?.8:g===3?1.35:1)));
    ease=clamp(ease+(g===3?.1:g===1?-.15:0),1.3,3);
  }
  return{reps,ease,int,lapse};
}
